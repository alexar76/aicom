# ---------------------------------------------------------------------------
# Oracles — per-slug per-lang {skill, blurb}. NAME stays English/brand.
# `math` is math-with-symbols → intentionally NOT translated (English fallback).
# ---------------------------------------------------------------------------
oracles:
  platon:
    ru:
      skill: "Верифицируемая случайность + динамический оракул"
      blurb: "32-мерная хаотическая среда, которая выдаёт подписанную, проверяемую энтропию и сигналы — случайность, нужная агентам для сэмплирования, нонсов, разрешения ничьих, лотерей и выбора лидера."
    es:
      skill: "Aleatoriedad verificable + oráculo dinámico"
      blurb: "Un sustrato caótico de 32 dimensiones que emite entropía y señales firmadas y auditables — la aleatoriedad que los agentes necesitan para muestreo, nonces, desempates, loterías y elección de líder."
    fr:
      skill: "Aléa vérifiable + oracle dynamique"
      blurb: "Un substrat chaotique à 32 dimensions qui émet une entropie et des signaux signés et auditables — l'aléa dont les agents ont besoin pour l'échantillonnage, les nonces, les départages, les loteries et l'élection de leader."
    zh:
      skill: "可验证随机性 + 动力学预言机"
      blurb: "一个 32 维混沌基底，输出已签名、可审计的熵与信号——智能体在采样、nonce、平局裁决、抽奖和领导者选举中所需的随机性。"
  chronos:
    ru:
      skill: "Верифицируемая задержка — доказательство прошедшего последовательного времени"
      blurb: "Доказывает, что прошло реальное, непараллелизуемое время. Честный порядок, анти-MEV, тайм-ауты — и несмещаемый маяк случайности при обёртке поверх Platon."
    es:
      skill: "Retardo verificable — prueba de tiempo secuencial transcurrido"
      blurb: "Demuestra que ha transcurrido tiempo real y no paralelizable. Orden justo, anti-MEV, tiempos de espera — y un faro de aleatoriedad insesgable cuando se envuelve sobre Platon."
    fr:
      skill: "Délai vérifiable — preuve de temps séquentiel écoulé"
      blurb: "Prouve qu'un temps réel et non parallélisable s'est écoulé. Ordonnancement équitable, anti-MEV, délais d'expiration — et une balise d'aléa impartiale lorsqu'elle enveloppe Platon."
    zh:
      skill: "可验证延迟——已流逝顺序时间的证明"
      blurb: "证明真实的、不可并行的时间已经流逝。公平排序、抗 MEV、超时——在包裹 Platon 之上时还提供不可偏置的随机性信标。"
  lattice:
    ru:
      skill: "Последовательности с низким расхождением (квазислучайные)"
      blurb: "Когда агентам нужно РАВНОМЕРНОЕ покрытие, а не случайные сгустки: квази-Монте-Карло интегрирование, сэмплирование, тестирование покрытия, инициализация оптимизации."
    es:
      skill: "Secuencias de baja discrepancia (cuasi-aleatorias)"
      blurb: "Cuando los agentes necesitan cobertura UNIFORME, no cúmulos aleatorios: integración cuasi-Monte-Carlo, muestreo, pruebas de cobertura y siembra de optimización."
    fr:
      skill: "Séquences à faible discrépance (quasi-aléatoires)"
      blurb: "Quand les agents ont besoin d'une couverture UNIFORME, pas d'amas aléatoires : intégration quasi-Monte-Carlo, échantillonnage, tests de couverture, amorçage d'optimisation."
    zh:
      skill: "低差异（准随机）序列"
      blurb: "当智能体需要均匀覆盖而非随机聚簇时：准蒙特卡洛积分、采样、覆盖测试、优化初始化。"
  murmuration:
    ru:
      skill: "Устойчивая агрегация консенсуса"
      blurb: "Превращает шумную толпу оценок агентов в одно число, устойчивое к сбоям — выбросы не могут его сдвинуть. Ценовые фиды, сортиция, федеративные решения."
    es:
      skill: "Agregación robusta de consenso"
      blurb: "Convierte una multitud ruidosa de estimaciones de agentes en un único número resistente a fallos — los valores atípicos no pueden moverlo. Feeds de precios, sorteo, decisiones federadas."
    fr:
      skill: "Agrégation robuste de consensus"
      blurb: "Transforme une foule bruitée d'estimations d'agents en un seul nombre résistant aux défaillances — les valeurs aberrantes ne peuvent pas le déplacer. Flux de prix, sortition, décisions fédérées."
    zh:
      skill: "稳健的共识聚合"
      blurb: "把嘈杂的一群智能体估计值汇聚成一个抗崩溃的数值——离群值无法撼动它。价格喂价、抽签、联邦决策。"
  lumen:
    ru:
      skill: "Оценки репутации и доверия"
      blurb: "Кому агент должен доверять при вызове? Устойчивая к сивилле репутация над графом взаимодействий — базовая потребность любой экономики агентов."
    es:
      skill: "Puntuaciones de reputación y confianza"
      blurb: "¿En quién debería confiar un agente para invocar? Reputación resistente a Sybil sobre un grafo de interacciones — la necesidad básica de cualquier economía de agentes."
    fr:
      skill: "Scores de réputation et de confiance"
      blurb: "À qui un agent doit-il faire confiance pour invoquer ? Une réputation résistante aux attaques Sybil sur un graphe d'interactions — le besoin fondamental de toute économie d'agents."
    zh:
      skill: "声誉与信任评分"
      blurb: "智能体在调用时该信任谁？在交互图上抗女巫攻击的声誉——任何智能体经济的基本需求。"
  colony:
    ru:
      skill: "Оптимизация с сертификатом качества"
      blurb: "Агенты выгружают NP-трудные подзадачи (маршрутизация, назначение, планирование) и получают почти оптимальный ответ ВМЕСТЕ с доказательством того, насколько он хорош."
    es:
      skill: "Optimización con un certificado de calidad"
      blurb: "Los agentes descargan subproblemas NP-difíciles (enrutamiento, asignación, planificación) y obtienen una respuesta casi óptima JUNTO con una prueba de lo buena que es."
    fr:
      skill: "Optimisation avec certificat de qualité"
      blurb: "Les agents délèguent des sous-problèmes NP-difficiles (routage, affectation, ordonnancement) et obtiennent une réponse quasi optimale AVEC une preuve de sa qualité."
    zh:
      skill: "带质量证书的优化"
      blurb: "智能体卸载 NP 难子问题（路由、分配、调度），获得近似最优解，并附带其优劣程度的证明。"
  turing:
    ru:
      skill: "Структурированное сэмплирование синим шумом"
      blurb: "Равномерные, органичные, никогда не слипающиеся наборы точек — лучше белого шума для сэмплирования, дизеринга, стипплинга и процедурных масок."
    es:
      skill: "Muestreo estructurado con ruido azul"
      blurb: "Conjuntos de puntos uniformes, orgánicos y nunca agrupados — superiores al ruido blanco para muestreo, tramado, punteado y máscaras procedurales."
    fr:
      skill: "Échantillonnage structuré par bruit bleu"
      blurb: "Des ensembles de points uniformes, organiques et jamais agglomérés — supérieurs au bruit blanc pour l'échantillonnage, le tramage, le pointillé et les masques procéduraux."
    zh:
      skill: "蓝噪声结构化采样"
      blurb: "均匀、自然、绝不聚簇的点集——在采样、抖动、点画和程序化蒙版方面优于白噪声。"
  percola:
    ru:
      skill: "Порог сетевой устойчивости"
      blurb: "Когда весь граф доверия разваливается? Вычисляет критическую долю атаки f_c, кривую коллапса, пик восприимчивости и ключевые узлы — глобальный фазовый переход, который не выразить ни одной поузловой оценкой."
    es:
      skill: "Umbral de resiliencia de red"
      blurb: "¿Cuándo se desmorona todo el grafo de confianza? Calcula la fracción crítica de ataque f_c, la curva de colapso, el pico de susceptibilidad y los nodos clave — una transición de fase global que ninguna puntuación por nodo puede expresar."
    fr:
      skill: "Seuil de résilience du réseau"
      blurb: "Quand tout le graphe de confiance s'effondre-t-il ? Calcule la fraction d'attaque critique f_c, la courbe d'effondrement, le pic de susceptibilité et les nœuds clés — une transition de phase globale qu'aucun score par nœud ne peut exprimer."
    zh:
      skill: "网络韧性阈值"
      blurb: "整个信任图何时崩溃？计算临界攻击比例 f_c、崩溃曲线、易感性峰值以及关键节点——这是任何单节点评分都无法表达的全局相变。"
  fermat:
    ru:
      skill: "Маршрутизация по наименьшему времени с двойственным сертификатом"
      blurb: "Доказуемо оптимальная композиция возможностей над взвешенным сервисным графом — возвращает путь наименьшего времени плюс эйкональные потенциалы T(v), которые любой клиент может проверить за O(E) без повторного запуска поиска."
    es:
      skill: "Enrutamiento de tiempo mínimo con certificado dual"
      blurb: "Composición de capacidades demostrablemente óptima sobre un grafo de servicios ponderado — devuelve la ruta de tiempo mínimo más los potenciales eikonales T(v) que cualquier cliente puede verificar en O(E) sin volver a ejecutar la búsqueda."
    fr:
      skill: "Routage au temps minimal avec certificat dual"
      blurb: "Composition de capacités prouvablement optimale sur un graphe de services pondéré — renvoie le chemin de temps minimal plus les potentiels eikonals T(v) que tout client peut vérifier en O(E) sans relancer la recherche."
    zh:
      skill: "带对偶证书的最短时间路由"
      blurb: "在加权服务图上可证明最优的能力组合——返回最短时间路径以及程函势 T(v)，任何客户端都能在 O(E) 内验证，无需重跑搜索。"
  ablation:
    ru:
      skill: "Системный каскадный риск (SOC-песочная куча)"
      blurb: "Хвостовой риск сети зависимостей: прогоняет нагрузку через песочную кучу, подгоняет степенной закон лавин τ, хвосты VaR/CVaR и триггерные узлы, которые запускают рыночные каскады."
    es:
      skill: "Riesgo sistémico de cascada (montón de arena SOC)"
      blurb: "El riesgo de cola de una red de dependencias: propaga estrés por un montón de arena, ajusta la ley de potencias de avalanchas τ, las colas VaR/CVaR y los nodos disparadores que encienden cascadas en todo el mercado."
    fr:
      skill: "Risque systémique de cascade (tas de sable SOC)"
      blurb: "Le risque de queue d'un réseau de dépendances : propage le stress à travers un tas de sable, ajuste la loi de puissance des avalanches τ, les queues VaR/CVaR et les nœuds déclencheurs qui allument des cascades à l'échelle du marché."
    zh:
      skill: "系统性级联风险（SOC 沙堆）"
      blurb: "依赖网络的尾部风险：把压力驱动通过沙堆，拟合雪崩幂律 τ、VaR/CVaR 尾部，以及点燃全市场级联的触发节点。"
  landauer:
    ru:
      skill: "Термодинамический аудит стоимости вычислений"
      blurb: "Физическая цена необратимых вычислений: подсчитывает логически стёртые биты, выводит энергетический предел kT·ln2 в джоулях, обратимую границу Беннетта и термодинамическую эффективность."
    es:
      skill: "Auditoría termodinámica del coste de cómputo"
      blurb: "El precio físico del cómputo irreversible: cuenta los bits borrados lógicamente, deriva el piso energético kT·ln2 en julios, el límite reversible de Bennett y la eficiencia termodinámica."
    fr:
      skill: "Audit thermodynamique du coût de calcul"
      blurb: "Le prix physique du calcul irréversible : compte les bits effacés logiquement, dérive le plancher énergétique kT·ln2 en joules, la borne réversible de Bennett et l'efficacité thermodynamique."
    zh:
      skill: "计算成本的热力学审计"
      blurb: "不可逆计算的物理代价：统计逻辑上被擦除的比特，推导以焦耳计的 kT·ln2 能量下限、Bennett 可逆下界以及热力学效率。"
  sortes:
    ru:
      skill: "Настоящий ECVRF — неподкручиваемая верифицируемая случайность"
      blurb: "Тянет жребий, который можно проверить. Для фиксированной пары (ключ, вход) существует ровно ОДИН корректный выход — оракул не может его подкрутить или сместить, а любой может проверить розыгрыш офлайн по 80-байтному доказательству. Лотереи, сортиция, выбор лидера, честные нонсы."
    es:
      skill: "ECVRF real — aleatoriedad verificable no manipulable"
      blurb: "Echa suertes que puedes verificar. Para un par fijo (clave, entrada) existe exactamente UNA salida válida — el oráculo no puede manipularla ni sesgarla, y cualquiera puede verificar el sorteo offline con una prueba de 80 bytes. Loterías, sorteo, elección de líder, nonces justos."
    fr:
      skill: "Véritable ECVRF — aléa vérifiable non manipulable"
      blurb: "Tire au sort de façon vérifiable. Pour un couple fixe (clé, entrée) il existe exactement UNE sortie valide — l'oracle ne peut ni la manipuler ni la biaiser, et quiconque peut vérifier le tirage hors ligne à partir d'une preuve de 80 octets. Loteries, sortition, élection de leader, nonces équitables."
    zh:
      skill: "真正的 ECVRF——不可操纵的可验证随机性"
      blurb: "抽出可验证的签。对于固定的（密钥、输入）对，恰好只有一个有效输出——预言机无法研磨或偏置它，任何人都能用 80 字节的证明离线验证抽取结果。抽奖、抽签、领导者选举、公平 nonce。"
  gauss:
    ru:
      skill: "Апостериор гауссовского процесса + подсказки активного обучения"
      blurb: "Превращает разреженные, зашумлённые наблюдения в калиброванный апостериор над функциями — среднее и честную неопределённость повсюду — и называет единственную лучшую следующую точку для сэмплирования. Принципиальная замена самодельным UCB / бандитам: неопределённость вычисляется, а не подбирается."
    es:
      skill: "Posterior de proceso gaussiano + sugerencias de aprendizaje activo"
      blurb: "Convierte observaciones escasas y ruidosas en un posterior calibrado sobre funciones — una media y una incertidumbre honesta en todas partes — y nombra el mejor punto siguiente para muestrear. El reemplazo con fundamento de los UCB / bandidos hechos a mano: la incertidumbre se calcula, no se ajusta a mano."
    fr:
      skill: "Postérieur de processus gaussien + suggestions d'apprentissage actif"
      blurb: "Transforme des observations rares et bruitées en un postérieur calibré sur des fonctions — une moyenne et une incertitude honnête partout — et désigne le meilleur point suivant à échantillonner. Le remplaçant rigoureux des UCB / bandits bricolés : l'incertitude est calculée, pas réglée à la main."
    zh:
      skill: "高斯过程后验 + 主动学习建议"
      blurb: "把稀疏、含噪的观测转化为对函数的校准后验——处处给出均值和诚实的不确定性——并指出下一个最值得采样的点。它是手工 UCB / 老虎机探索的有原则替代品：不确定性是计算出来的，而非调出来的。"
  aestus:
    ru:
      skill: "Головоломки с временной блокировкой — запечатать сейчас, открыть позже"
      blurb: "Запечатывает данные так, что НИКТО не может открыть их раньше, чем пройдёт ~T последовательных возведений в квадрат реального времени — а затем это может ЛЮБОЙ, без держателя лазейки. Аукционы с закрытыми ставками, «выключатели мертвеца», отложенное раскрытие, честные согласованные раскрытия. Там, где Chronos доказывает, что прошлое истекло, Aestus запирает будущее."
    es:
      skill: "Rompecabezas con bloqueo temporal — sellar ahora, abrir después"
      blurb: "Sella datos de modo que NADIE pueda abrirlos antes de que transcurran ~T elevaciones al cuadrado secuenciales de tiempo real — y luego CUALQUIERA puede, sin poseedor de trampa. Subastas de sobre cerrado, interruptores de hombre muerto, divulgación temporizada, revelaciones coordinadas justas. Donde Chronos prueba que el pasado transcurrió, Aestus bloquea el futuro."
    fr:
      skill: "Casse-têtes à verrou temporel — sceller maintenant, ouvrir plus tard"
      blurb: "Scelle les données de sorte que PERSONNE ne puisse les ouvrir avant l'écoulement d'environ T élévations au carré séquentielles en temps réel — puis N'IMPORTE QUI le peut, sans détenteur de trappe. Enchères sous pli scellé, dispositifs d'homme mort, divulgation temporisée, révélations coordonnées équitables. Là où Chronos prouve que le passé s'est écoulé, Aestus verrouille l'avenir."
    zh:
      skill: "时间锁谜题——现在封存，之后开启"
      blurb: "封存数据，使得在约 T 次顺序平方运算的真实时间流逝之前，任何人都无法打开——而之后任何人都可以，且无需陷门持有者。密封投标拍卖、死人开关、定时披露、公平的协调揭示。Chronos 证明过去已流逝，而 Aestus 锁住未来。"
  betti:
    ru:
      skill: "Топологическая форма — устойчивые гомологии"
      blurb: "Какую ФОРМУ имеют данные? Строит фильтрацию Вьеториса-Рипса и считывает числа Бетти b0 (кластеры), b1 (петли), b2 (пустоты) по масштабу, плюс тревога дрейфа по бутылочному расстоянию — структура, которую не выразить ни одной скалярной сводкой."
    es:
      skill: "Forma topológica — homología persistente"
      blurb: "¿Qué FORMA tienen los datos? Construye una filtración de Vietoris-Rips y lee los números de Betti b0 (clústeres), b1 (bucles), b2 (huecos) a lo largo de la escala, más una alarma de deriva por distancia de cuello de botella — estructura que ningún resumen escalar puede expresar."
    fr:
      skill: "Forme topologique — homologie persistante"
      blurb: "Quelle FORME ont les données ? Construit une filtration de Vietoris-Rips et lit les nombres de Betti b0 (amas), b1 (boucles), b2 (cavités) à travers l'échelle, plus une alarme de dérive par distance de goulot — une structure qu'aucun résumé scalaire ne peut exprimer."
    zh:
      skill: "拓扑形状——持续同调"
      blurb: "数据具有什么形状？构建 Vietoris-Rips 过滤，读取跨尺度的 Betti 数 b0（聚簇）、b1（环路）、b2（空洞），以及瓶颈距离漂移告警——这是任何标量摘要都无法表达的结构。"
  kantor:
    ru:
      skill: "Точный оптимальный транспорт с двойственным сертификатом"
      blurb: "Насколько дёшево одно распределение может стать другим — и доказуемо ли это самое дешёвое? Решает точную задачу Вассерштейна / землекопа и возвращает план транспортировки плюс потенциалы Канторовича, которые любой клиент может проверить за O(m·n) без повторного решения."
    es:
      skill: "Transporte óptimo exacto con certificado dual"
      blurb: "¿Cuán barato puede una distribución convertirse en otra — y es demostrablemente la más barata? Resuelve el problema exacto de Wasserstein / del transportista de tierra y devuelve el plan de transporte más los potenciales de Kantorovich que cualquier cliente puede verificar en O(m·n) sin volver a resolver."
    fr:
      skill: "Transport optimal exact avec certificat dual"
      blurb: "À quel point une distribution peut-elle devenir une autre à moindre coût — et est-ce prouvablement le moins cher ? Résout le problème exact de Wasserstein / du terrassier et renvoie le plan de transport plus les potentiels de Kantorovich que tout client peut vérifier en O(m·n) sans re-résoudre."
    zh:
      skill: "带对偶证书的精确最优传输"
      blurb: "一个分布变成另一个分布能有多便宜——而且可证明这是最便宜的吗？求解精确的 Wasserstein / 推土机问题，返回传输方案以及 Kantorovich 势，任何客户端都能在 O(m·n) 内验证，无需重解。"
  fourier:
    ru:
      skill: "Спектральный анализ графа — спектр лапласиана и число Фидлера"
      blurb: "Преобразование Фурье на графе. Считывает алгебраическую связность λ₂ (насколько сеть близка к расколу), вектор Фидлера и его спектральное разбиение, а также спектральное вложение — глобальную структуру, которую не улавливает ни одна поузловая метрика."
    es:
      skill: "Análisis espectral de grafos — espectro laplaciano y valor de Fiedler"
      blurb: "La transformada de Fourier sobre un grafo. Lee la conectividad algebraica λ₂ (cuán cerca está una red de dividirse), el vector de Fiedler y su bisección espectral, y una incrustación espectral — la estructura global que ninguna métrica por nodo captura."
    fr:
      skill: "Analyse spectrale de graphe — spectre du laplacien et valeur de Fiedler"
      blurb: "La transformée de Fourier sur un graphe. Lit la connectivité algébrique λ₂ (à quel point un réseau est proche de se scinder), le vecteur de Fiedler et sa bissection spectrale, ainsi qu'un plongement spectral — la structure globale qu'aucune métrique par nœud ne capture."
    zh:
      skill: "图谱分析——拉普拉斯谱与 Fiedler 值"
      blurb: "图上的傅里叶变换。读取代数连通度 λ₂（网络离分裂有多近）、Fiedler 向量及其谱二分，以及谱嵌入——这是任何单节点度量都捕捉不到的全局结构。"

