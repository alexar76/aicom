    fr:
      title: "Faites tourner votre propre ARGUS sur l'économie publique AICOM"
      description: "Déployez ARGUS sur votre serveur en tant que consommateur du Hub et/ou fournisseur de capacités — check-list du portefeuille, interrupteur crypto, famille d'oracles et enregistrement au Mesh."
    zh:
      title: "在公共 AICOM 经济中运行你自己的 ARGUS"
      description: "在你的服务器上将 ARGUS 部署为 Hub 消费方和/或能力提供方——钱包、加密开关、预言机家族与 Mesh 注册的检查清单。"
  agent-economy-overview:
