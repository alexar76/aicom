# Courses — per-folder per-lang {title, tagline, description}.
# Descriptive titles are translated; acronyms/product names stay Latin.
# ---------------------------------------------------------------------------
courses:
  verifiable-randomness-course:
    ru:
      title: "Верифицируемая случайность и криптографическое время"
      tagline: "Соберите и сломайте смещённые лотереи — затем проверьте доказательства офлайн из 80 байт."
      description: "Практический курс по верифицируемой случайности, VDF, ECVRF и головоломкам с временной блокировкой на живых оракулах AIMarket."
    es:
      title: "Aleatoriedad verificable y tiempo criptográfico"
      tagline: "Construye y rompe loterías sesgadas — luego verifica pruebas offline desde 80 bytes."
      description: "Curso práctico sobre aleatoriedad verificable, VDF, ECVRF y rompecabezas de bloqueo temporal usando oráculos AIMarket en vivo."
    fr:
      title: "Aléa vérifiable et temps cryptographique"
      tagline: "Construisez et cassez des loteries biaisées — puis vérifiez les preuves hors ligne à partir de 80 octets."
      description: "Cours pratique sur l'aléa vérifiable, les VDF, l'ECVRF et les casse-têtes à verrou temporel avec les oracles AIMarket en direct."
    zh:
      title: "可验证随机性与密码学时间"
      tagline: "构建并攻破有偏抽奖——然后从 80 字节离线验证证明。"
      description: "关于可验证随机性、VDF、ECVRF 与时间锁谜题的实操课程，使用实时 AIMarket 预言机。"
  mcp-security-course:
    ru:
      title: "Безопасность MCP и защита агентов"
      tagline: "Смоделируйте угрозы MCP, ловите отравление инструментов с WARDEN, укрепляйте агентов через оценку LUMEN."
      description: "Практический курс по моделям угроз MCP, статическому сканированию и файрволу WARDEN для безопасности агентов."
    es:
      title: "Seguridad de MCP y protección de agentes"
      tagline: "Modela amenazas de MCP, detecta el envenenamiento de herramientas con WARDEN y refuerza agentes con la puntuación LUMEN."
      description: "Curso práctico sobre modelos de amenazas de MCP, escaneo estático y el firewall WARDEN para la seguridad de agentes."
    fr:
      title: "Sécurité MCP et protection des agents"
      tagline: "Modélisez les menaces MCP, détectez l'empoisonnement d'outils avec WARDEN, renforcez les agents avec le score LUMEN."
      description: "Cours pratique sur les modèles de menaces MCP, l'analyse statique et le pare-feu WARDEN pour la sécurité des agents."
    zh:
      title: "MCP 安全与智能体防护"
      tagline: "对 MCP 建立威胁模型，用 WARDEN 捕捉工具投毒，用 LUMEN 评分加固智能体。"
      description: "关于 MCP 威胁模型、静态扫描以及用于智能体安全的 WARDEN 防火墙的实操课程。"
  agent-economy-course:
    ru:
      title: "Постройте экономику агентов с нуля"
      tagline: "Опубликуйте платную возможность, соберите USDC через эскроу и отправьте агента-потребителя."
      description: "Практический курс по AIMarket Protocol v2, SDK, Hub, эскроу, каналам и монетизации возможностей агентов."
    es:
      title: "Construye una economía de agentes desde cero"
      tagline: "Publica una capacidad de pago, cobra USDC mediante depósito en garantía y despliega un agente consumidor."
      description: "Curso práctico sobre AIMarket Protocol v2, SDK, Hub, depósito en garantía, canales y monetización de capacidades de agentes."
    fr:
      title: "Construisez une économie d'agents à partir de zéro"
      tagline: "Publiez une capacité payante, encaissez de l'USDC via séquestre et livrez un agent consommateur."
      description: "Cours pratique sur AIMarket Protocol v2, le SDK, le Hub, le séquestre, les canaux et la monétisation des capacités d'agents."
    zh:
      title: "从零构建智能体经济"
      tagline: "发布付费能力，通过托管收取 USDC，并交付一个消费方智能体。"
      description: "关于 AIMarket Protocol v2、SDK、Hub、托管、通道以及智能体能力变现的实操课程。"
  3d-data-viz-course:
    ru:
      title: "3D-визуализация данных с Alien Monitor"
      tagline: "Проверяйте здоровье API alien-monitor, топологию и репутацию LUMEN — затем отобразите сцены оракулов в R3F."
      description: "Практический курс по визуализатору экосистемы alien-monitor — REST-зонды, графовые модели и отображение сцен в React Three Fiber."
    es:
      title: "Visualización de datos 3D con Alien Monitor"
      tagline: "Sondea la salud de la API de alien-monitor, la topología y la reputación LUMEN — luego mapea escenas de oráculos a R3F."
      description: "Curso práctico sobre el visualizador del ecosistema alien-monitor — sondas REST, modelos de grafos y mapeo de escenas en React Three Fiber."
    fr:
      title: "Visualisation de données 3D avec Alien Monitor"
      tagline: "Sondez la santé de l'API alien-monitor, la topologie et la réputation LUMEN — puis mappez les scènes d'oracles vers R3F."
      description: "Cours pratique sur le visualiseur de l'écosystème alien-monitor — sondes REST, modèles de graphes et mappage de scènes en React Three Fiber."
    zh:
      title: "用 Alien Monitor 进行 3D 数据可视化"
      tagline: "探测 alien-monitor 的 API 健康、拓扑与 LUMEN 声誉——然后把预言机场景映射到 R3F。"
      description: "关于 alien-monitor 生态可视化器的实操课程——REST 探测、图模型以及 React Three Fiber 场景映射。"
  physics-inspired-computing-course:
    ru:
      title: "Вычисления, вдохновлённые физикой, для инженеров"
      tagline: "Консенсусные рои, сертификаты TSP, сэмплирование синим шумом, каскадный риск и термодинамика Ландауэра."
      description: "Практический курс по оракулам AIMarket, вдохновлённым физикой — Murmuration, Colony, Turing, Ablation и Landauer с живыми вызовами."
    es:
      title: "Computación inspirada en la física para ingenieros"
      tagline: "Enjambres de consenso, certificados de TSP, muestreo de ruido azul, riesgo de cascada y termodinámica de Landauer."
      description: "Curso práctico sobre oráculos AIMarket inspirados en la física — Murmuration, Colony, Turing, Ablation y Landauer con llamadas en vivo."
    fr:
