# SEO landing i18n — translations for the 5-language build (en / ru / es / fr / zh).
#
# English is the source of truth and lives in the build script (_EN_UI) plus the
# upstream data (oracles.ts / catalog.yaml / guides.yaml). This file supplies the
# ru/es/fr/zh renderings. ANY missing key/field falls back to English so the build
# never breaks — partial translation is safe.
#
# Rules (see docs/localization-glossary.md):
#   - Never translate brands / product names / code / CLI / env vars / URLs /
#     identifiers / prices / math with symbols. They stay in English everywhere.
#   - Oracle NAME stays English/brand. Capability table (id/price/output) stays
#     English (it is code). Oracle `math` is math-with-symbols → kept English
#     (intentionally not translated here; it falls back to the English source).
#   - Course titles are descriptive (not brand) so they are translated; product
#     acronyms inside them (MCP, USDC, AI-Factory, R3F, …) stay Latin.

# ---------------------------------------------------------------------------
# Fixed chrome strings. English keys are documented for reference; the loader
# falls back to the in-code _EN_UI table for any key/lang omitted below.
