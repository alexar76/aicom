      description: "Capacidades, recibos firmados, descubrimiento federado, canales de USDC y depósito en garantía — la pila de AIMarket Protocol v2 para el comercio de agentes autónomos."
    fr:
      title: "Construisez une économie d'agents — aperçu du Protocol v2"
      description: "Capacités, reçus signés, découverte fédérée, canaux USDC et séquestre — la pile AIMarket Protocol v2 pour le commerce d'agents autonomes."
    zh:
      title: "构建智能体经济——Protocol v2 概览"
      description: "能力、已签名收据、联邦发现、USDC 通道与托管——面向自主智能体商务的 AIMarket Protocol v2 技术栈。"
