guides:
  call-verifiable-oracle:
    ru:
      title: "Вызовите верифицируемый оракул из вашего AI-агента"
      description: "Находите, вызывайте и независимо проверяйте Platon VRF, Chronos VDF и репутацию LUMEN примерно в 5 строк — через MCP (Cursor, Claude) или сырой HTTP на AIMarket Hub."
    es:
      title: "Llama a un oráculo verificable desde tu agente de IA"
      description: "Descubre, invoca y verifica de forma independiente Platon VRF, Chronos VDF y la reputación LUMEN en ~5 líneas — vía MCP (Cursor, Claude) o HTTP en crudo sobre AIMarket Hub."
    fr:
      title: "Appelez un oracle vérifiable depuis votre agent IA"
      description: "Découvrez, invoquez et vérifiez de manière indépendante Platon VRF, Chronos VDF et la réputation LUMEN en ~5 lignes — via MCP (Cursor, Claude) ou HTTP brut sur AIMarket Hub."
    zh:
      title: "从你的 AI 智能体调用可验证预言机"
      description: "用约 5 行代码发现、调用并独立验证 Platon VRF、Chronos VDF 和 LUMEN 声誉——通过 MCP（Cursor、Claude）或在 AIMarket Hub 上使用原始 HTTP。"
  verifiable-randomness-and-time:
    ru:
      title: "Верифицируемая случайность и криптографическое время для агентов"
      description: "Спецификация продукта для хаос-VRF Platon и Wesolowski VDF Chronos — устойчивая к смещению случайность и доказательство прошедшего времени, которое любой агент может проверить офлайн."
    es:
      title: "Aleatoriedad verificable y tiempo criptográfico para agentes"
      description: "Especificación de producto para el chaos-VRF de Platon y el VDF Wesolowski de Chronos — aleatoriedad resistente al sesgo y prueba de tiempo transcurrido que cualquier agente puede verificar offline."
    fr:
      title: "Aléa vérifiable et temps cryptographique pour agents"
      description: "Spécification produit pour le chaos-VRF de Platon et le VDF Wesolowski de Chronos — un aléa résistant au biais et une preuve de temps écoulé que tout agent peut vérifier hors ligne."
    zh:
      title: "面向智能体的可验证随机性与密码学时间"
      description: "Platon 混沌 VRF 与 Chronos Wesolowski VDF 的产品规范——抗偏置的随机性以及任何智能体都能离线验证的已流逝时间证明。"
  reputation-and-trust:
    ru:
      title: "Репутация и оценки доверия агентов (LUMEN / EigenTrust)"
      description: "Устойчивая к сивилле репутация над графом взаимодействий — как LUMEN оценивает MCP-серверы и возможности для безопасной коммерции между агентами."
    es:
      title: "Reputación y puntuaciones de confianza de agentes (LUMEN / EigenTrust)"
      description: "Reputación resistente a Sybil sobre un grafo de interacciones — cómo LUMEN puntúa servidores MCP y capacidades para un comercio seguro entre agentes."
    fr:
      title: "Réputation et scores de confiance des agents (LUMEN / EigenTrust)"
      description: "Une réputation résistante aux attaques Sybil sur un graphe d'interactions — comment LUMEN note les serveurs MCP et les capacités pour un commerce sûr entre agents."
    zh:
      title: "智能体声誉与信任评分（LUMEN / EigenTrust）"
      description: "在交互图上抗女巫攻击的声誉——LUMEN 如何为 MCP 服务器和能力评分，以实现安全的智能体间商务。"
  mcp-payment-and-security:
    ru:
      title: "Платёжные каналы MCP и модель безопасности агентов"
      description: "Микроплатёжные каналы HTTP 402, лимиты трат, файрвол WARDEN с fail-closed и модель угроз для сторонних MCP-инструментов в автономных агентах."
    es:
      title: "Canales de pago de MCP y modelo de seguridad de agentes"
      description: "Canales de micropago HTTP 402, límites de gasto, firewall WARDEN fail-closed y modelo de amenazas para herramientas MCP de terceros en agentes autónomos."
    fr:
      title: "Canaux de paiement MCP et modèle de sécurité des agents"
      description: "Canaux de micropaiement HTTP 402, plafonds de dépense, pare-feu WARDEN fail-closed et modèle de menaces pour les outils MCP tiers dans les agents autonomes."
    zh:
      title: "MCP 支付通道与智能体安全模型"
      description: "HTTP 402 微支付通道、消费上限、fail-closed 的 WARDEN 防火墙，以及自主智能体中第三方 MCP 工具的威胁模型。"
  external-argus-operator:
    ru:
      title: "Запустите собственный ARGUS в публичной экономике AICOM"
      description: "Разверните ARGUS на своём сервере как потребителя Hub и/или поставщика возможностей — чек-лист по кошельку, переключателю крипто, семейству оракулов и регистрации в Mesh."
    es:
