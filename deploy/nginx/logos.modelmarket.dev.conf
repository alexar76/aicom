# LOGOS — federation analytics engine. Runs ON the oracle host (the same one that
# serves the oracle family, GAIA and MOMUS), NOT the factory host.
#
# DNS: A record  logos  →  the oracle host
# Install: sudo ./scripts/deploy_logos.sh   (builds the stack, wires this, runs certbot)
#
# Without this vhost the hostname falls through to the default server, which
# answers as another service on the box and serves a certificate that does not
# cover logos.modelmarket.dev.
#
# Backing container (loopback only, from logos/docker-compose.yml):
#   logos  127.0.0.1:5199   nginx inside the image serves the React dashboard and
#                           proxies /api/ + /health to the FastAPI backend (:9460)

upstream logos_app { server 127.0.0.1:5199; keepalive 4; }

# The dashboard is public and read-only, but /api/ fans out to the whole
# federation and /api/v1/chat costs LLM tokens — rate-limit per IP at the edge,
# on top of the app's own limiter.
limit_req_zone $binary_remote_addr zone=logos_api:10m rate=2r/s;
# nginx answers a throttled request with 503 by default, which reads as "the
# service is down" — say what actually happened, and match what the app's own
# limiter returns.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name logos.modelmarket.dev;

    client_max_body_size 1m;

    # This block only ever serves over TLS once certbot has run; pin HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Let's Encrypt ACME (must precede everything else).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://logos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A2A agent card — discovery, served by the backend.
    location = /.well-known/agent-card.json {
        proxy_pass http://logos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE streaming (/api/v1/chat/stream) must not be buffered or the reply
    # arrives in one lump at the end.
    location /api/v1/chat/stream {
        limit_req zone=logos_api burst=5 nodelay;
        proxy_pass http://logos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=logos_api burst=20 nodelay;
        proxy_pass http://logos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The React dashboard (SPA fallback handled inside the container).
    location / {
        proxy_pass http://logos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
