# DOLOS landing — dolos.modelmarket.dev
#
# Static marketing page for the dynamic EVM red-team harness (CLI; no live API).
# Sibling landings: forge.modelmarket.dev (HEPHAESTUS), basanos.modelmarket.dev (service).
#
# Source of truth: dolos/docs/landing/
# DNS: A record  dolos  →  same Hub host as forge.modelmarket.dev / modelmarket.dev
# Deploy:
#   ./scripts/deploy_dolos_landing.sh --remote root@my-vps --identity ~/.ssh/id_ed25519_factory

server {
    listen 80;
    listen [::]:80;
    server_name dolos.modelmarket.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dolos.modelmarket.dev;

    root /var/www/dolos.modelmarket.dev;
    index index.html;
    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/dolos.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dolos.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
