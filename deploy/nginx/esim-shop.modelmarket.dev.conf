# esim-shop.modelmarket.dev — the example eSIM shop for new operators (esim-kit/store/, container
# travel-esim on 127.0.0.1:9497) in demo mode: live prices, a banner, payments off. The kit's landing
# and guides live at esim.modelmarket.dev. Certificate by certbot webroot, renewed by certbot.timer.
server {
    listen 80;
    listen [::]:80;
    server_name esim-shop.modelmarket.dev;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name esim-shop.modelmarket.dev;
    ssl_certificate     /etc/letsencrypt/live/esim-shop.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esim-shop.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:9497;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
