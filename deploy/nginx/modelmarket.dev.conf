# AIMarket Hub — modelmarket.dev → hub API (host port 9083)
# Install:
#   sudo cp deploy/nginx/modelmarket.dev.conf /etc/nginx/sites-available/modelmarket.dev
#   sudo ln -sf /etc/nginx/sites-available/modelmarket.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (after DNS A/AAAA → this host):
#   sudo certbot --nginx -d modelmarket.dev -d www.modelmarket.dev \
#     --non-interactive --agree-tos --redirect -m YOUR_EMAIL@example.com
#
# Certbot rewrites this file (adds :443 ssl, HTTP→HTTPS redirect). Timer: certbot.timer
#
# CLIENT ADDRESS (required for the hub's per-IP rate limits to mean anything):
# every request reaches the hub from 127.0.0.1, so without the forwarded header the
# per-IP channel cap and the invoke rate limiter put THE WHOLE INTERNET in one bucket.
# Both must hold:
#   1. every location that proxies to :9083 sets X-Forwarded-For (below), and
#   2. the hub is started with the proxy declared:
#        AIMARKET_TRUSTED_PROXIES=127.0.0.1
#      (read by aimarket_hub.api._client_address and by `aimarket serve`, which passes
#      it to uvicorn as forwarded_allow_ips; unset means "trust no forwarded header").
# $proxy_add_x_forwarded_for APPENDS $remote_addr to any header the client sent, so a
# forged value stays to the LEFT of the real one — the hub reads the list right-to-left
# and takes the rightmost untrusted hop, i.e. the address nginx itself observed.

server {
    listen 80;
    listen [::]:80;
    server_name modelmarket.dev www.modelmarket.dev;

    client_max_body_size 4M;

    # Hub API + well-known + widget static (see aimarket-hub/nginx/nginx.conf)
    location /.well-known/ {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai-market/ {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /widget/ {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /widget.js {
        proxy_pass http://127.0.0.1:9083/widget/widget.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /themes.css {
        proxy_pass http://127.0.0.1:9083/widget/themes.css;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /live {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
