# AIMarket Hub — modelmarket.dev → hub API (host port 9083)
# Install:
#   sudo cp deploy/nginx/modelmarket.dev.conf /etc/nginx/sites-available/modelmarket.dev
#   sudo ln -sf /etc/nginx/sites-available/modelmarket.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (after DNS A/AAAA → this host):
#   sudo certbot --nginx -d modelmarket.dev -d www.modelmarket.dev \
#     --non-interactive --agree-tos --redirect -m YOUR_EMAIL@example.com
#
# Certbot rewrites this file (adds :443 ssl, HTTP→HTTPS redirect). Timer: certbot.timer
#
# CLIENT ADDRESS (required for the hub's per-IP rate limits to mean anything):
# every request reaches the hub from 127.0.0.1, so without the forwarded header the
# per-IP channel cap and the invoke rate limiter put THE WHOLE INTERNET in one bucket.
# Both must hold:
#   1. every location that proxies to :9083 sets X-Forwarded-For (below), and
#   2. the hub is started with the proxy declared:
#        AIMARKET_TRUSTED_PROXIES=127.0.0.1
#      (read by aimarket_hub.api._client_address and by `aimarket serve`, which passes
#      it to uvicorn as forwarded_allow_ips; unset means "trust no forwarded header").
# $proxy_add_x_forwarded_for APPENDS $remote_addr to any header the client sent, so a
# forged value stays to the LEFT of the real one — the hub reads the list right-to-left
# and takes the rightmost untrusted hop, i.e. the address nginx itself observed.

server {
    listen 80;
    listen [::]:80;
    server_name modelmarket.dev www.modelmarket.dev;

    client_max_body_size 4M;

    # Hub API + well-known + widget static (see aimarket-hub/nginx/nginx.conf)
    # ERC-8004 registration files for the agents this domain operates (deploy/erc-8004/ in the monorepo).
    location ^~ /.well-known/erc-8004/ {
        alias /var/www/erc-8004/;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /.well-known/agent-registration.json {
        alias /var/www/erc-8004/agent-registration.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /.well-known/ {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai-market/ {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
    }

    location /widget/ {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /widget.js {
        proxy_pass http://127.0.0.1:9083/widget/widget.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /themes.css {
        proxy_pass http://127.0.0.1:9083/widget/themes.css;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /live {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # weather.witness@v1 — a first-party provider on this host (examples/subcontract-capability).
    # The trailing slash on proxy_pass strips the prefix: /providers/weather-witness/invoke -> /invoke.
    # Pay-on-Verified demo providers (pov-demo/), host port 9476: /honest/ and /cheat/.
    location /providers/pov-demo/ {
        proxy_pass http://127.0.0.1:9476/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
    }

    location /providers/weather-witness/ {
        proxy_pass http://127.0.0.1:9475/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
        client_max_body_size 64k;
    }

    # okx-a2mcp — our own services as OKX.AI A2MCP endpoints (okx-a2mcp/), host port 9485.
    # The gateway reads the caller from X-Forwarded-For (trusting loopback + the Docker bridge).
    location /a2mcp {
        proxy_pass http://127.0.0.1:9485;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # okx-a2mcp x402 twins: the same services paid over x402 (USDC on Base, CDP facilitator,
    # listed in the CDP Bazaar), same container on 9485.
    # x402 capability manifest (draft-hawkins-x402-dns-discovery), from the same gateway.
    location = /.well-known/x402 {
        proxy_pass http://127.0.0.1:9485;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /x402/ {
        proxy_pass http://127.0.0.1:9485;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
        # An x402 402 carries the whole Bazaar listing in its PAYMENT-REQUIRED header; the
        # default 4 KiB header buffer turned the larger ones into a 502.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location / {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
    }
}
