# HEPHAESTUS landing — forge.modelmarket.dev
#
# The public word "forge" belongs to HEPHAESTUS (the smith), not to BASANOS
# (the touchstone). This vhost serves the HEPHAESTUS landing only.
# The live studio stays at https://modelmarket.dev/studio/
# BASANOS (contract assurance) is a different host: basanos.modelmarket.dev
#
# Source of truth: hephaestus/docs/landing/
# DNS: A record  forge  →  same origin as modelmarket.dev (Hub host).
# Deploy:
#   rsync -a --delete hephaestus/docs/landing/ \
#     root@<hub-host>:/var/www/forge.modelmarket.dev/
#   sudo ln -sf /etc/nginx/sites-available/forge.modelmarket.dev.conf \
#     /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d forge.modelmarket.dev
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name forge.modelmarket.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forge.modelmarket.dev;

    root /var/www/forge.modelmarket.dev;
    index index.html;
    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/forge.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
