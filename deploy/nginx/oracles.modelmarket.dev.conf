# Run ON Platon host (203.0.113.20), NOT on the factory/nginx host.
#
# DNS (Timeweb): A record oracles → 203.0.113.20
# Install: sudo ./scripts/setup-oracles-platon-on-host.sh
#
# Platon app must listen on 127.0.0.1:8080.

upstream platon_app {
    server 127.0.0.1:8080;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name oracles.modelmarket.dev;

    client_max_body_size 16M;

    location /.well-known/ {
        proxy_pass http://platon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://platon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
