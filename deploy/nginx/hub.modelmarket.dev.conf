# AIMarket Hub — hub.modelmarket.dev → competing Hub API (host port 9083)
# Sibling of deploy/nginx/hunt.modelmarket.dev.conf on the SAME host (108.165.32.182,
# which also serves use./warden./om./pantheon. and two unrelated properties).
#
# TLS: issued 2026-09-03 with the same authenticator as its siblings —
#     certbot certonly --webroot -w /var/www/certbot -d hub.modelmarket.dev
# Renewal reloads nginx through the host's global deploy hook
# (/etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh).
#
# Until that certificate existed this vhost was port-80 only, so HTTPS on the name fell
# through to the box's first 443 vhost and served a certificate for emberlinedesk.com.
# The ACME location here must stay /var/www/certbot: this file said /var/www/html while
# the deployed vhost and every sibling used /var/www/certbot.

server {
    listen 80;
    listen [::]:80;
    server_name hub.modelmarket.dev;
    client_max_body_size 4M;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.modelmarket.dev;
    client_max_body_size 4M;

    ssl_certificate     /etc/letsencrypt/live/hub.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/ {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ai-market/ {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
