# GAIA — physical-world oracle gateway. Runs ON the oracle host (203.0.113.20),
# NOT the factory/nginx host.
#
# DNS (Timeweb): A record  iot  →  203.0.113.20
# Install: sudo ./scripts/deploy_gaia.sh   (builds the stack, wires this, runs certbot)
#
# Backing containers (loopback only, from gaia/docker-compose.yml):
#   gaia-backend   127.0.0.1:9320   AIMarket v2 + /v1/verify + /wot
#   gaia-frontend  127.0.0.1:5185   the R3F 3D landing (static SPA)
#
# TLS: existing Let's Encrypt lineage iot.modelmarket.dev (SAN: iot + gaia).
# Do not rely on `certbot --nginx` rewriting this file — a busy certbot lock
# used to leave HTTPS unconfigured, and SNI then served logos.modelmarket.dev.

upstream gaia_backend  { server 127.0.0.1:9320; keepalive 4; }
upstream gaia_frontend { server 127.0.0.1:5185; keepalive 4; }

# ── HTTP: ACME + redirect to HTTPS ──────────────────────────────────────────
server {
    # Edge security headers (2026-10-08).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    listen 80;
    listen [::]:80;
    server_name iot.modelmarket.dev gaia.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    proxy_redirect http://$host/ https://$host/;  # slash redirects must not leave https
    # Edge security headers (2026-10-08).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iot.modelmarket.dev gaia.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/iot.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 10m;
    # JSON compresses ~7x (the 880-device fleet registry: 456 KB -> 63 KB). These bodies carry no
    # secret next to reflected input, so compression leaks nothing (BREACH needs both).
    gzip on;
    gzip_types application/json text/javascript application/javascript text/css;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;

    # robots.txt and sitemap.xml, not the app's index.html.
    include /etc/nginx/snippets/seo-crawl-defaults.conf;

    location = /health {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/ai-market.json {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ai-market/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /aimarket/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v1/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # Pay-on-verified device control: public status and evidence; kill/resume need
    # GAIA_ACTUATION_TOKEN (the backend answers 401/503 without it).
    location /actuation/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /wot {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The call log's operator API stays on loopback (curl 127.0.0.1:9320/ops/v1/... on the
    # host): it is token-gated anyway, but it is no business of the internet.
    location ^~ /ops/ {
        return 404;
    }
    # The owner's page: switch your own plugs with a wallet signature (gaia.owner.*@v1).
    location /owner {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # gaia.modelmarket.dev serves the same pages: page visits go to iot.modelmarket.dev, so search
        # engines see one site. The API paths above (/api/, /v1/, /ai-market/, …) answer on both names.
        if ($host = gaia.modelmarket.dev) { return 301 https://iot.modelmarket.dev$request_uri; }
        # Crawler-visible text inside <div id="root"> (React replaces it on mount).
        include /etc/nginx/snippets/spa-text/iot.modelmarket.dev.conf;
        proxy_pass http://gaia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
