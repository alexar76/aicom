# GAIA — physical-world oracle gateway. Runs ON the oracle host (203.0.113.20),
# NOT the factory/nginx host.
#
# DNS (Timeweb): A record  iot  →  203.0.113.20
# Install: sudo ./scripts/deploy_gaia.sh   (builds the stack, wires this, runs certbot)
#
# Backing containers (loopback only, from gaia/docker-compose.yml):
#   gaia-backend   127.0.0.1:9320   AIMarket v2 + /v1/verify + /wot
#   gaia-frontend  127.0.0.1:5185   the R3F 3D landing (static SPA)
#
# TLS: existing Let's Encrypt lineage iot.modelmarket.dev (SAN: iot + gaia).
# Do not rely on `certbot --nginx` rewriting this file — a busy certbot lock
# used to leave HTTPS unconfigured, and SNI then served logos.modelmarket.dev.

upstream gaia_backend  { server 127.0.0.1:9320; keepalive 4; }
upstream gaia_frontend { server 127.0.0.1:5185; keepalive 4; }

# ── HTTP: ACME + redirect to HTTPS ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name iot.modelmarket.dev gaia.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iot.modelmarket.dev gaia.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/iot.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 10m;

    location = /health {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/ai-market.json {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ai-market/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /aimarket/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v1/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /wot {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://gaia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
