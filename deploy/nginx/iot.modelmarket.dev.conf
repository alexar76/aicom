# GAIA — physical-world oracle gateway. Runs ON the oracle host (78.17.126.214),
# NOT the factory/nginx host.
#
# DNS (Timeweb): A record  iot  →  78.17.126.214
# Install: sudo ./scripts/deploy_gaia.sh   (builds the stack, wires this, runs certbot)
#
# Backing containers (loopback only, from gaia/docker-compose.yml):
#   gaia-backend   127.0.0.1:9320   AIMarket v2 + /v1/verify + /wot
#   gaia-frontend  127.0.0.1:5185   the R3F 3D landing (static SPA)

upstream gaia_backend  { server 127.0.0.1:9320; keepalive 4; }
upstream gaia_frontend { server 127.0.0.1:5185; keepalive 4; }

server {
    listen 80;
    listen [::]:80;
    server_name iot.modelmarket.dev gaia.modelmarket.dev;

    client_max_body_size 10m;

    # This block only ever serves over TLS once certbot has run; pin HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Let's Encrypt ACME (must precede everything else).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ── GAIA backend (loopback :9320) ─────────────────────────────────────────
    # AIMarket discovery / manifest / invoke, the Pay-on-Verified verifier slot,
    # WoT Thing Descriptions, health. Matched before the SPA fallback so the
    # frontend never swallows an API path.
    location = /health {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/ai-market.json {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ai-market/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /aimarket/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v1/ {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /wot {
        proxy_pass http://gaia_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── GAIA frontend (loopback :5185) — the 3D landing, SPA fallback ─────────
    location / {
        proxy_pass http://gaia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
