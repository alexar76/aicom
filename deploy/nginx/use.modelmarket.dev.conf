# Use-cases portal — use.modelmarket.dev (static)
# TLS via certbot webroot (/var/www/certbot). HSTS on this name requires HTTPS.

# The demo invoke is deliberately fixed to one public weather capability and
# rate-limited. The portal cannot be used as an open proxy to arbitrary SKUs.
limit_req_zone $binary_remote_addr zone=portal_live_invoke:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name use.modelmarket.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name use.modelmarket.dev;

    root /var/www/use.modelmarket.dev;
    index index.html;
    client_max_body_size 4M;

    ssl_certificate     /etc/letsencrypt/live/use.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/use.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Lightweight, read-only fleet evidence. Exact locations win over the
    # static .json rule below and keep upstream CORS concerns off the client.
    location = /live/snapshot.json {
        limit_except GET { deny all; }
        proxy_pass https://atlas.modelmarket.dev/api/v1/snapshot;
        proxy_ssl_server_name on;
        proxy_ssl_name atlas.modelmarket.dev;
        proxy_set_header Host atlas.modelmarket.dev;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Explicit-click demo: route the fixed GAIA SKU THROUGH Hub so the accepted
    # peer result receives the same AWR provenance receipt as any marketplace
    # invoke. Client input is ignored, preventing capability/device selection.
    # The browser supplies an opaque per-install sandbox visitor id; the hub owns
    # the quota and charges $0 while preserving the $0.001 catalogue price.
    location = /live/weather {
        limit_except POST { deny all; }
        limit_req zone=portal_live_invoke burst=3 nodelay;
        limit_req_status 429;
        proxy_pass https://modelmarket.dev/ai-market/v2/invoke;
        proxy_ssl_server_name on;
        proxy_ssl_name modelmarket.dev;
        proxy_set_header Host modelmarket.dev;
        proxy_set_header Content-Type application/json;
        proxy_set_header X-AIMarket-Sandbox-Visitor $http_x_aimarket_sandbox_visitor;
        proxy_method POST;
        proxy_set_body '{"product_id":"gaia.gateway","capability_id":"gaia.weather.read@v1","source_hub":"https://iot.modelmarket.dev","input":{"device_id":"om-wx-01"}}';
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Two fixed, bounded ATLAS product demos. The bbox is intentionally owned
    # by the server: the public portal can demonstrate real product semantics
    # without becoming an arbitrary Hub relay. Both invokes travel through Hub
    # and therefore receive the same portable provenance receipt as weather.
    location = /live/fire-weather {
        limit_except POST { deny all; }
        limit_req zone=portal_live_invoke burst=3 nodelay;
        limit_req_status 429;
        proxy_pass https://modelmarket.dev/ai-market/v2/invoke;
        proxy_ssl_server_name on;
        proxy_ssl_name modelmarket.dev;
        proxy_set_header Host modelmarket.dev;
        proxy_set_header Content-Type application/json;
        proxy_set_header X-AIMarket-Sandbox-Visitor $http_x_aimarket_sandbox_visitor;
        proxy_method POST;
        proxy_set_body '{"product_id":"atlas.products","capability_id":"atlas.fire.weather@v1","source_hub":"https://atlas.modelmarket.dev","input":{"west":52,"south":50,"east":57,"north":54,"limit":8,"max_weather_km":1000}}';
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /live/watchbox {
        limit_except POST { deny all; }
        limit_req zone=portal_live_invoke burst=3 nodelay;
        limit_req_status 429;
        proxy_pass https://modelmarket.dev/ai-market/v2/invoke;
        proxy_ssl_server_name on;
        proxy_ssl_name modelmarket.dev;
        proxy_set_header Host modelmarket.dev;
        proxy_set_header Content-Type application/json;
        proxy_set_header X-AIMarket-Sandbox-Visitor $http_x_aimarket_sandbox_visitor;
        proxy_method POST;
        proxy_set_body '{"product_id":"atlas.products","capability_id":"atlas.watchbox.check@v1","source_hub":"https://atlas.modelmarket.dev","input":{"west":52,"south":50,"east":57,"north":54,"layers":["fire","weather"]}}';
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML and JSON are release manifests, not immutable assets. Keeping them
    # revalidated prevents an old idea page from loading a week-old catalog.
    location ~* \.html$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.json$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
