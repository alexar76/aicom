server {
 listen 80; listen [::]:80;
 server_name ecosystem.modelmarket.dev;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://ecosystem.modelmarket.dev$request_uri; }
}
server {
 listen 443 ssl; listen [::]:443 ssl;
 server_name ecosystem.modelmarket.dev;
 root /var/www/ecosystem.modelmarket.dev;
 index index.html;
 ssl_certificate /etc/letsencrypt/live/ecosystem.modelmarket.dev/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/ecosystem.modelmarket.dev/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 # IndexNow key (scripts/indexnow_submit.py).
 include /etc/nginx/snippets/indexnow-key.conf;

 location / { try_files $uri $uri/ =404; }
}
