# WARDEN landing — warden.modelmarket.dev (static, single file)
#
# WARDEN is a library: there is no service to proxy here, and that absence is the
# point of the page. So this site has no upstream, no API surface and no state —
# just one self-contained document in five languages.
#
# TLS via certbot webroot (/var/www/certbot).

server {
    listen 80;
    listen [::]:80;
    server_name warden.modelmarket.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name warden.modelmarket.dev;

    root /var/www/warden.modelmarket.dev;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/warden.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warden.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # nginx `add_header` does not merge: a single add_header inside a location
    # DROPS every header inherited from the server block. Setting these once at
    # server level and adding Cache-Control per location silently served the page
    # with no CSP at all — verified against the live response, not assumed. So the
    # security headers are repeated in every location that adds one of its own.
    include /etc/nginx/snippets/warden-security-headers.conf;

    location = / {
        try_files /index.html =404;
        expires off;
        include /etc/nginx/snippets/warden-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ERC-8004 endpoint-domain proof: this domain confirms WARDEN's registration (agent 96684 on
    # Base). Kept in step with deploy/erc-8004/ids.json.
    location = /.well-known/agent-registration.json {
        default_type application/json;
        include /etc/nginx/snippets/warden-security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"registrations":[{"agentId":96684,"agentRegistry":"eip155:8453:0x8004A169FB4a3325136EB29fA0ceB6D2e539a432"}]}';
    }

    # Any other /.well-known/ path is a real 404, not the landing page the SPA fallback below
    # would answer with 200 (a verifier reading text/html for a .json path is misled).
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/warden-security-headers.conf;
    }

    location ~* \.html$ {
        expires off;
        include /etc/nginx/snippets/warden-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(svg|png|webp|woff2?)$ {
        expires 7d;
        include /etc/nginx/snippets/warden-security-headers.conf;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }
}
