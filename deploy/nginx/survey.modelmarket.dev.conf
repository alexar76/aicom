# x402 delivery survey — survey.modelmarket.dev
#
# Static page of one settled probe. Not HISTOR, not a product landing.
# Source: scripts/delivery-survey/site/index.html
#         scripts/delivery-survey/results/2026-10-20.json (no payer)
# DNS: A record  survey  →  the same host as verify.modelmarket.dev and
#      dolos.modelmarket.dev (factory host). The address is on the host, not in git.
# Deploy:
#   ./scripts/deploy_survey_page.sh --remote root@factory-vps --issue-cert
# TLS: certbot --nginx -d survey.modelmarket.dev, after the A record points here.
#      Until the cert exists the deploy script serves an HTTP bootstrap with the
#      ACME webroot and does not install this HTTPS block.

server {
    listen 80;
    listen [::]:80;
    server_name survey.modelmarket.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name survey.modelmarket.dev;

    root /var/www/survey.modelmarket.dev;
    index index.html;
    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/survey.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/survey.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # robots.txt and sitemap.xml, not the app's index.html.
    include /etc/nginx/snippets/seo-crawl-defaults.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
