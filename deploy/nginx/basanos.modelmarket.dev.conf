# BASANOS — Solidity assurance node. Live on the ORACLE host (same box as
# MOMUS / LOGOS / GAIA), published on its own domain basanos.modelmarket.dev.
#
# DNS: A record  basanos  →  the oracle host (NOT hunt, NOT Hub).
# Hub serves HEPHAESTUS at forge.modelmarket.dev. This vhost is the touchstone.
#
# Backing container (loopback only, from basanos/docker-compose.yml):
#   basanos  127.0.0.1:9470
#
# Install: sudo ./scripts/deploy_basanos.sh

upstream basanos_app { server 127.0.0.1:9470; keepalive 4; }

# (limit_req_status is already set once in logos.modelmarket.dev.conf — do not duplicate.)
limit_req_zone $binary_remote_addr zone=basanos_invoke:10m rate=4r/s;

server {
    listen 80;
    listen [::]:80;
    server_name basanos.modelmarket.dev;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name basanos.modelmarket.dev;

    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/basanos.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/basanos.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /health {
        proxy_pass http://basanos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /invoke {
        limit_req zone=basanos_invoke burst=8 nodelay;
        proxy_pass http://basanos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The federation's invoke path. Same handler as /invoke, so it needs the same limiter —
    # falling through to the catch-all `location /` below would leave the CPU-heavy scan
    # endpoint with no rate limit at all, reachable by anyone who read the manifest.
    location = /ai-market/v2/invoke {
        limit_req zone=basanos_invoke burst=8 nodelay;
        proxy_pass http://basanos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /intel {
        limit_req zone=basanos_invoke burst=4 nodelay;
        proxy_pass http://basanos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://basanos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
