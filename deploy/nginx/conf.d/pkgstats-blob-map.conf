# Which GitHub repository a stray "/blob/master/<path>" on magic-ai-factory.com belongs to.
# Package pages (pkgstats.com and the like) join a README's relative links to the package's
# homepage, so magic-ai-factory.com received /blob/master/docs/... and answered 404 to people
# (137 times from 128 addresses in October 2026). Used by snippets/pkgstats-blob-redirects.conf.
# Paths found in one repository only go there; files every repository has follow the package
# page the visitor came from, and dioscuri (most of that traffic) otherwise.
map $uri $blob_repo_by_path {
    default "";
    ~^/blob/(?:master/)?docs/ecosystem/                                   aicom;
    ~^/blob/(?:master/)?(?:docs/AGENT-TO-WEBSITE\.md|docs/examples/|docs/PROMPTS\.md|docs/DEPLOY\.md|llm/)  aicom-landing;
    ~^/blob/(?:master/)?(?:docs/setup\.md|docs/architecture\.md|src/|docs/use-cases\.md|docs/usage\.md|docs/runbook|docs/content-plan\.md|README-ru\.md|tsconfig\.json)  dioscuri;
}
map $http_referer $blob_repo_by_referer {
    default "";
    ~*pkg:@alexar76/dioscuri   dioscuri;
    ~*pkg:aicom-landing        aicom-landing;
    ~*pkg:aicom-factory        aimarket-sdks;
}
