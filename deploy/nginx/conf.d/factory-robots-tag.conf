# X-Robots-Tag for magic-ai-factory.com, set in its HTTPS server block.
# Bing and DuckDuckGo had indexed 13 /admin?tab= pages, /admin/login and the Swagger page at
# /api/docs (2026-10-21). An empty value sends no header, so other pages are untouched.
map $uri $factory_robots_tag {
    default        "";
    ~^/admin(/|$)  "noindex, nofollow";
    ~^/api/        "noindex, nofollow";
}
