# AI-Factory — magic-ai-factory.com → Docker Compose app UI (default host port 9080)
# Install (new host, HTTP only): sudo cp deploy/nginx/magic-ai-factory.com.conf ...
# Production with TLS already on the server: use magic-ai-factory.com.production.conf — NEVER overwrite
# a live Certbot vhost with this HTTP-only file (HTTPS will fall through to Gitea default_server).
#           sudo ln -sf /etc/nginx/sites-available/magic-ai-factory.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# TLS: see docs/production-domain.md — certbot rewrites this file on the server (adds :443, redirect on :80).
# After HTTPS: NEXT_PUBLIC_SITE_URL=https://magic-ai-factory.com and docker compose build app

server {
    listen 80;
    listen [::]:80;
    server_name magic-ai-factory.com www.magic-ai-factory.com;

    location = /monitor {
        return 302 /monitor/;
    }

    location ^~ /monitor/ {
        proxy_pass http://127.0.0.1:9100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Demo replay clip — stream from API (bypass Next.js rewrite for large binary)
    location ^~ /api/public/pipeline-demo-replay {
        proxy_pass http://127.0.0.1:9081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /landing-page-generation {
        return 302 /landing-page-generation/;
    }

    location ^~ /landing-page-generation/ {
        proxy_pass http://127.0.0.1:3847/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
