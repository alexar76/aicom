# Signal Hunt — hunt.modelmarket.dev
# Mirrors signal-hunt/Caddyfile path split (Hub well-known + AIMarket vs Game).

upstream signal_hunt_hub {
    server 127.0.0.1:9084;
}
upstream signal_hunt_game {
    server 127.0.0.1:8060;
}

server {
    listen 80;
    listen [::]:80;
    server_name hunt.modelmarket.dev;

    client_max_body_size 4M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /.well-known/ai-market.json {
        proxy_pass http://signal_hunt_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai-market/ {
        proxy_pass http://signal_hunt_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://signal_hunt_game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
