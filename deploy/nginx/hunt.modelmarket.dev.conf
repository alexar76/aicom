# Signal Hunt — hunt.modelmarket.dev
# Mirrors signal-hunt/Caddyfile path split (Hub well-known + AIMarket vs Game).

upstream signal_hunt_hub {
    server 127.0.0.1:9084;
}
upstream signal_hunt_game {
    server 127.0.0.1:8060;
}

server {
    # Edge security headers (2026-10-08).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    listen 80;
    listen [::]:80;
    server_name hunt.modelmarket.dev;

    client_max_body_size 4M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /.well-known/ai-market.json {
        proxy_pass http://signal_hunt_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The same discovery document under the Internet-Draft's name (aimarket-hub
    # docs/discovery-names.md). `location /` below is the game, so each hub path is named.
    location = /.well-known/agent-marketplace {
        proxy_pass http://signal_hunt_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent Resource Discovery (aimarket-hub docs/ard.md, 2026-11-04): the ARD manifest, the did:web document its
    # signatures name, the MCP server card it pins by digest, and the ARD registry.
    location = /.well-known/ard.json {
        proxy_pass http://signal_hunt_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/did.json {
        proxy_pass http://signal_hunt_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/mcp/server-card.json {
        proxy_pass http://signal_hunt_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /ard/ {
        proxy_pass http://signal_hunt_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai-market/ {
        proxy_pass http://signal_hunt_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # A routed seller's own 402 is passed through with its PAYMENT-REQUIRED header, which carries the whole
        # listing (agent-exec: 6.4 KB); the default 4 KiB header buffer turned it into a 502 (2026-11-08).
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # The game's front page with the ARD link relation (initial-contact 4.3.2). Exact match, so every other game
    # path is unchanged; an add_header in a location drops the server-level ones, so they are repeated.
    location = / {
        include /etc/nginx/snippets/spa-text/hunt.modelmarket.dev.conf;
        proxy_pass http://signal_hunt_game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Link '<https://hunt.modelmarket.dev/.well-known/ard.json>; rel="ard"' always;
    }

    location / {
        # Crawler-visible text inside <div id="root"> (React replaces it on mount).
        include /etc/nginx/snippets/spa-text/hunt.modelmarket.dev.conf;
        proxy_pass http://signal_hunt_game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
