# Grafana — https://magic-ai-factory.com/grafana/ → http://127.0.0.1:9082
# Strip /grafana/ prefix; Grafana uses GF_SERVER_ROOT_URL for public asset links.
# Requires GF_SERVER_SERVE_FROM_SUB_PATH=false in docker-compose.yml.

location = /grafana {
    return 302 /grafana/;
}

location ^~ /grafana/ {
    rewrite ^/grafana/(.*) /$1 break;
    proxy_pass http://127.0.0.1:9082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Fallback when a client resolves assets without the /grafana/ prefix
location ^~ /public/build/ {
    proxy_pass http://127.0.0.1:9082/public/build/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}
