# Static ARGUS promo landing (ecosystem-landing/argus/) on magic-ai-factory.com.
# Deploy files: sudo ./scripts/setup-argus-landing.sh
# Live Arena UI stays at /arena/ and /argus/arena/ (see argus-arena.conf).

location = /argus {
    return 302 /argus/;
}

location = /argus/ {
    default_type text/html;
    charset utf-8;
    root /var/www;
    try_files /argus-landing/index.html =404;
    add_header Cache-Control "public, max-age=300";
}

location ^~ /argus/i18n/ {
    alias /var/www/argus-landing/i18n/;
    add_header Cache-Control "public, max-age=3600";
}

location ^~ /argus/assets/ {
    alias /var/www/argus-landing/assets/;
    add_header Cache-Control "public, max-age=3600";
}

location = /argus/humor-cartoon.html {
    alias /var/www/argus-landing/humor-cartoon.html;
    add_header Cache-Control "public, max-age=300";
}
