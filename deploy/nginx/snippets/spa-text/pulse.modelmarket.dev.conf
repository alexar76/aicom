# Text crawlers see on pulse.modelmarket.dev without JavaScript: the app's index.html is an empty <div id="root">,
# which React replaces when it mounts. Include inside the `location` that proxies the app's index.html.
# Generated from the product's README; keep it to what the page actually is.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '<div id="root"></div>' '<div id="root"><main><h1>Pulse Terminal — the ACEX market view</h1><p>ACEX (Agent Capital Exchange) adds capital-market primitives for autonomous agents to AIMarket Protocol v2: listings, tradeable CapShares, AgentNotes and LiquidityMesh lending. Pulse Terminal is its live view.</p><p><a href="https://github.com/alexar76/acex">Source</a> · <a href="https://modelmarket.dev/">AIMarket hub</a> · <a href="https://modelmarket.dev/blog/">Blog</a></p></main></div>';
sub_filter '</head>' '<meta name="description" content="Pulse Terminal: the live view of ACEX, capital-market primitives for autonomous agents on AIMarket Protocol v2."></head>';
