# Text crawlers see on service-mesh.modelmarket.dev without JavaScript: the app's index.html is an empty <div id="root">,
# which React replaces when it mounts. Include inside the `location` that proxies the app's index.html.
# Generated from the product's README; keep it to what the page actually is.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '<div id="root"></div>' '<div id="root"><main><h1>AI Service Mesh — activity dashboard</h1><p>Discovery, zero-trust verification, escrow and payment between AI agents. This dashboard shows what the mesh is doing right now; the API is documented at /docs.</p><p><a href="/docs">API docs</a> · <a href="https://modelmarket.dev/">AIMarket hub</a> · <a href="https://modelmarket.dev/blog/">Blog</a></p></main></div>';
sub_filter '</head>' '<meta name="description" content="AI Service Mesh: discovery, zero-trust verification, escrow and payment between AI agents, with a live activity dashboard."></head>';
