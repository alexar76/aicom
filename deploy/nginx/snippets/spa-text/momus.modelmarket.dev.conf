# Text crawlers see on momus.modelmarket.dev without JavaScript: the app's index.html is an empty <div id="root">,
# which React replaces when it mounts. Include inside the `location` that proxies the app's index.html.
# Generated from the product's README; keep it to what the page actually is.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '<div id="root"></div>' '<div id="root"><main><h1>MOMUS — the ecosystem’s autonomous red team</h1><p>MOMUS runs safe, read-only adversarial probes against the ecosystem’s own components — free-tier ceilings, manifest and receipt signatures, settlement gates, prompt-injection surfaces — and publishes Ed25519-signed findings anyone can verify offline.</p><p><a href="/bulletin">Bulletin</a> · <a href="https://github.com/alexar76/momus">Source</a> · <a href="https://modelmarket.dev/blog/">Blog</a></p></main></div>';
