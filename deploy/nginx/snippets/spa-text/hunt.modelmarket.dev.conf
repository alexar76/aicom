# Text crawlers see on hunt.modelmarket.dev without JavaScript: the app's index.html is an empty <div id="root">,
# which React replaces when it mounts. Include inside the `location` that proxies the app's index.html.
# Generated from the product's README; keep it to what the page actually is.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '<div id="root"></div>' '<div id="root"><main><h1>Signal Hunt — investigate the live AIMarket federation</h1><p>A game and a lab in one: each round turns a measured change in the live federation into a short case. Read the hub’s evidence, choose the most likely cause, state your confidence and check how the round was scored.</p><p><a href="https://modelmarket.dev/">AIMarket hub</a> · <a href="https://modelmarket.dev/blog/">Blog</a></p></main></div>';
