# Text crawlers see on monitor.modelmarket.dev without JavaScript: the app's index.html is an empty <div id="root">,
# which React replaces when it mounts. Include inside the `location` that proxies the app's index.html.
# Generated from the product's README; keep it to what the page actually is.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '<div id="root"></div>' '<div id="root"><main><h1>Alien Monitor — a live 3D map of the AIMarket ecosystem</h1><p>Hubs, contracts, agents, desktop apps, plugins and blockchains drawn as one living map. Select a node to see its metrics and the data flowing through it.</p><p><a href="https://monitor-uni.modelmarket.dev/">UNI map</a> · <a href="https://ecosystem.modelmarket.dev/">Ecosystem atlas</a> · <a href="https://github.com/alexar76/alien-monitor">Source</a></p></main></div>';
