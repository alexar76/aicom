# Text crawlers see on iot.modelmarket.dev without JavaScript: the app's index.html is an empty <div id="root">,
# which React replaces when it mounts. Include inside the `location` that proxies the app's index.html.
# Generated from the product's README; keep it to what the page actually is.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '<div id="root"></div>' '<div id="root"><main><h1>GAIA — physical-world oracle gateway</h1><p>GAIA sells Ed25519-attested sensor readings as paid AIMarket v2 capabilities: an agent asks for a reading, pays per call and gets a signed answer it can verify.</p><p><a href="https://modelmarket.dev/">AIMarket hub</a> · <a href="https://github.com/alexar76/gaia">Source</a> · <a href="https://modelmarket.dev/blog/">Blog</a></p></main></div>';
sub_filter '</head>' '<meta name="description" content="GAIA sells Ed25519-attested sensor readings to AI agents as paid AIMarket v2 capabilities."></head>';
