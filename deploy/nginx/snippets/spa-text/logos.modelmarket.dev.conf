# Text crawlers see on logos.modelmarket.dev without JavaScript: the app's index.html is an empty <div id="root">,
# which React replaces when it mounts. Include inside the `location` that proxies the app's index.html.
# Generated from the product's README; keep it to what the page actually is.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '<div id="root"></div>' '<div id="root"><main><h1>LOGOS — analytics across the AIMarket federation</h1><p>LOGOS queries the federation’s components — oracles, scanners, treasuries, reputation graphs, bridges — through the hub, finds anomalies across hubs and answers questions in plain language. It only reads.</p><p><a href="/landing/">About LOGOS</a> · <a href="https://modelmarket.dev/">AIMarket hub</a> · <a href="https://modelmarket.dev/blog/">Blog</a></p></main></div>';
