# Inside the magic-ai-factory.com HTTPS server block. README links that package pages turned into
# addresses on this site go to the file on GitHub (main is every repository's default branch).
# merge_slashes is on, so "//blob/..." and "/argus//blob/..." arrive here as one slash.

# ARGUS (npm @alexar76/argus3, argus-3, argus-warden: homepage magic-ai-factory.com/argus/).
# A longer ^~ prefix: snippets/argus-arena.conf holds "location ^~ /argus/", which beats any regex.
location ^~ /argus/blob/ {
    rewrite ^/argus/blob/(?:master/|main/)?(.*)$ https://github.com/alexar76/argus/blob/main/$1 permanent;
}

# The root one is a regex: it wins over the plain "location /" that answered 404.

# Packages whose homepage is the site root (dioscuri, aicom-landing, aicom-factory).
location ~ ^/blob/(?:master/|main/)?(?<root_blob>.*)$ {
    set $blob_repo $blob_repo_by_path;
    if ($blob_repo = "") { set $blob_repo $blob_repo_by_referer; }
    if ($blob_repo = "") { set $blob_repo dioscuri; }
    return 301 https://github.com/alexar76/$blob_repo/blob/main/$root_blob;
}
