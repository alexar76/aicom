# ARGUS one-line installer — static file for curl | bash
# Deploy: sudo ./scripts/setup-argus-install.sh
# Usage:  curl -fsSL https://magic-ai-factory.com/install | bash

location = /install {
    default_type text/plain;
    charset utf-8;
    alias /var/www/aicom-install/install;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff";
}

# Exact match wins over the /argus/ reverse-proxy block.
location = /argus/install {
    default_type text/plain;
    charset utf-8;
    alias /var/www/aicom-install/install;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff";
}
