# robots.txt and sitemap.xml for single-page-app hosts.
# Include inside the HTTPS server block: include /etc/nginx/snippets/seo-crawl-defaults.conf;
#
# A single-page app answers every path with its index.html, so crawlers that asked these
# hosts for robots.txt and sitemap.xml got the app's HTML page with a 200 (16 hosts on
# 2026-10-21). A real file of that name in the site root still wins; otherwise robots.txt
# allows everything and points at a sitemap that lists the home page.
# $server_name, not $host: the sitemap must not echo whatever Host header a client sent.

location = /robots.txt {
    try_files $uri @seo_robots;
}

location = /sitemap.xml {
    try_files $uri @seo_sitemap;
}

location @seo_robots {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n\nSitemap: https://$server_name/sitemap.xml\n";
}

location @seo_sitemap {
    default_type application/xml;
    return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n  <url><loc>https://$server_name/</loc></url>\n</urlset>\n";
}
