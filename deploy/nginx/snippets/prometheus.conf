# Prometheus — https://magic-ai-factory.com/prometheus/ → http://127.0.0.1:9090
# Requires --web.route-prefix=/prometheus/ on the Prometheus container.
# Basic auth: /etc/nginx/.htpasswd-prometheus (written by scripts/deploy_observability.sh).

location = /prometheus {
    return 302 /prometheus/;
}

location ^~ /prometheus/ {
    auth_basic "AI-Factory Prometheus";
    auth_basic_user_file /etc/nginx/.htpasswd-prometheus;
    proxy_pass http://127.0.0.1:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
