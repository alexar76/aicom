# Shared rate-limit zone for the AIMarket School hub bridge.
#
# MUST be installed at http level and EXACTLY ONCE — nginx refuses to start with
#   [emerg] limit_req_zone "school_hub" is already bound to key "$binary_remote_addr"
# if two site files declare it. Both School hosts (edu.modelmarket.dev and the
# /school/ mirror on modeldev.modelmarket.dev) can live in the same nginx, so the
# zone lives here instead of in either vhost.
#
# Install: /etc/nginx/conf.d/school-hub-zone.conf
#          (the stock nginx.conf includes /etc/nginx/conf.d/*.conf at http level)
# Used by: deploy/nginx/snippets/school-hub-bridge.conf

limit_req_zone $binary_remote_addr zone=school_hub:10m rate=5r/s;
