# Alien Monitor LIVE — factory path → subdomain (legacy snippet name).
# Prefer the combined snippet `alien-monitor.conf` (UNI + LIVE redirects).
# Kept so older installers that only patch /monitor-live/ still land on the LIVE host.

location = /monitor-live {
    return 302 https://monitor.modelmarket.dev/;
}

location ^~ /monitor-live/ {
    rewrite ^/monitor-live/(.*)$ https://monitor.modelmarket.dev/$1 permanent;
}
