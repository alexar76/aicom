# THEMIS — publish-time admission gate. Lives on the HUB host (the apex
# modelmarket.dev box), NOT on the oracle host.
#
# DNS: A record  themis  →  the same address as the apex modelmarket.dev.
#
# That co-location is not a convenience, it is load-bearing. The Hub calls the
# auditor at AIMARKET_SUPPLY_CHAIN_AUDITOR_URL, default
# http://127.0.0.1:8080/invoke — loopback inside the Hub's own netns, because the
# Hub's SSRF guard refuses docker-network names. Move THEMIS to another box and
# that admission call stops working. (The oracle host is doubly wrong: Platon
# already owns 127.0.0.1:8080 there — see oracles.modelmarket.dev.conf.)
#
# This vhost therefore adds a PUBLIC read/purchase surface to a service that was
# reachable only from the Hub. The admission path itself is untouched: the Hub
# keeps talking to 127.0.0.1:8080 directly and never traverses nginx.
#
# Backing container (loopback only): themis  127.0.0.1:8080
#
# Install:
#   sudo cp deploy/nginx/themis.modelmarket.dev.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/themis.modelmarket.dev.conf \
#               /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/certbot -d themis.modelmarket.dev
#   (the port above is published by the HUB container, not by THEMIS)
#   sudo nginx -t && sudo systemctl reload nginx

# THEMIS has no network namespace of its own: it runs inside the Hub container's
# (scripts/attach_themis_to_hub.sh explains why — the Hub's SSRF guard exempts loopback and
# nothing else). So its listener is not on the host's 8080; it is reachable only through the
# port the HUB container publishes for it, 127.0.0.1:9460 -> 8080, set by
# deploy_hub_rebuild.sh. Pointing this at 127.0.0.1:8080 gets a connection refused, which is
# how this vhost went uninstalled for as long as it did.
upstream themis_app { server 127.0.0.1:9460; keepalive 4; }

# (limit_req_status is set once elsewhere in this nginx config — do not duplicate.)
# An audit parses and scores a whole candidate dossier, so it is real CPU per call.
limit_req_zone $binary_remote_addr zone=themis_invoke:10m rate=4r/s;

server {
    listen 80;
    listen [::]:80;
    server_name themis.modelmarket.dev;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name themis.modelmarket.dev;

    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/themis.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/themis.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /health {
        proxy_pass http://themis_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Federation discovery. The Hub crawler reads the well-known, follows
    # manifest_url, and verifies the manifest signature against the pinned seed
    # key. Without these two the node cannot enter the federated catalogue — and
    # signal-hunt derives its sources from that catalogue, while the LOGOS
    # assistant answers from the same live capability list.
    location = /.well-known/ai-market.json {
        proxy_pass http://themis_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ai-market/v2/manifest {
        proxy_pass http://themis_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /invoke {
        limit_req zone=themis_invoke burst=8 nodelay;
        proxy_pass http://themis_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://themis_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
