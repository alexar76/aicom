# AIMarket School — edu.modelmarket.dev
# Full TLS vhost (do not let certbot strip the hub bridge).
# DNS: A record edu → factory public host.
# Deploy: ./scripts/deploy_edu_school.sh --remote my-vps
#
# The hub-bridge rate-limit zone is declared once at http level by
# deploy/nginx/snippets/school-hub-zone.conf → /etc/nginx/conf.d/.

server {
    listen 80;
    listen [::]:80;
    server_name edu.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/edu.modelmarket.dev;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edu.modelmarket.dev;

    root /var/www/edu.modelmarket.dev;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/edu.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edu.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Browser demos call /hub/… on this origin (hub CORS is fail-closed).
    include /etc/nginx/snippets/school-hub-bridge.conf;

    # Academy SEO hub lives on modeldev (+ GitHub Pages). School clips stay at /.
    location ^~ /learn {
        return 302 https://modeldev.modelmarket.dev/learn/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
