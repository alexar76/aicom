# Alien Monitor UNI map — public subdomain.
#
# Public: no basic auth.
# DNS: A record  monitor-uni  →  factory host.
# Upstream: alien-monitor on loopback :9100 (ALIEN_MODE=universe).
#
# The image may still bake Vite base=/monitor/; keep both / and /monitor/
# so absolute asset URLs and a root bookmark both work (nginx strips the prefix).
# LIVE lives on monitor.modelmarket.dev (:9101).
#
# Do NOT redefine map $http_upgrade $connection_upgrade on this host.

upstream alien_monitor_uni { server 127.0.0.1:9100; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name monitor-uni.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor-uni.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/monitor-uni.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor-uni.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 8m;

    # Baked Vite base=/monitor/ → absolute /monitor/assets|api|ws
    location ^~ /monitor/ {
        proxy_pass http://alien_monitor_uni/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://alien_monitor_uni;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
