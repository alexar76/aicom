# ATLAS — physical sensor map (weather / air / tide / quakes over GAIA).
#
# Public: no basic auth / no password gate.
# DNS: A record  atlas  →  this host (factory).
# Install: sudo ./scripts/deploy_atlas.sh
#
# Upstream: atlas container on loopback :9330
# TLS: certbot certonly (webroot) + this file; renew via certbot.timer.

upstream atlas_app { server 127.0.0.1:9330; keepalive 8; }

limit_req_zone $binary_remote_addr zone=atlas_api:10m rate=30r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME + redirect to HTTPS ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name atlas.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: public UI (no auth) ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atlas.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/atlas.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 2m;

    location = /health {
        proxy_pass http://atlas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=atlas_api burst=60 nodelay;
        proxy_pass http://atlas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://atlas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
