# AICOM Provenance Verifier — verify.modelmarket.dev
# Static tool served from docs/verifier/ (index.html + js/ + style.css + data/).
# Client-side Ed25519 verification (tweetnacl) — no backend needed.
# HTTP template only; certbot adds TLS on the factory host (same fleet as modeldev).
#
# DNS: A record  verify → <origin-ip>  (factory host).
# Deploy:
#   rsync -a --delete docs/verifier/ root@<factory-host>:/var/www/verify.modelmarket.dev/
#   sudo ln -sf /etc/nginx/sites-available/verify.modelmarket.dev.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d verify.modelmarket.dev
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name verify.modelmarket.dev;

    root /var/www/verify.modelmarket.dev;
    index index.html;

    # /r/<receipt-id> deep-links (verify_url) fall back to the tool, which reads the id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
