# AICOM Provenance Verifier — verify.modelmarket.dev
# Static tool served from docs/verifier/ (index.html + js/ + style.css + data/).
# Client-side Ed25519 verification (tweetnacl) — no backend needed.
# HTTP template only; certbot adds TLS on the factory host (same fleet as modeldev).
#
# DNS: A record  verify → <origin-ip>  (factory host).
# Deploy:
#   rsync -a --delete docs/verifier/ root@<factory-host>:/var/www/verify.modelmarket.dev/
#   sudo ln -sf /etc/nginx/sites-available/verify.modelmarket.dev.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d verify.modelmarket.dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# The rsync also carries ns/awr/v2.jsonld, which the `location = /ns/awr/v2` block below
# serves as the AWR/2 JSON-LD context. It is a copy of awr/ns/v2/context.json; a test in
# the reference suite fails if the two ever drift apart.

server {
    listen 80;
    listen [::]:80;
    server_name verify.modelmarket.dev;

    root /var/www/verify.modelmarket.dev;
    index index.html;

    # The AWR/2 JSON-LD namespace (SPEC.md 3.1). It MUST be matched BEFORE the fallback
    # below: `try_files ... /index.html` answered /ns/awr/v2 with the verifier's HTML page
    # and a 200, so a JSON-LD consumer asking for a context got text/html and no way to
    # tell it had failed. A 404 would have been better; this serves the real document.
    # CORS is open because the consumer is usually a browser on someone else's origin.
    location = /ns/awr/v2 {
        default_type application/ld+json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        alias /var/www/verify.modelmarket.dev/ns/awr/v2.jsonld;
    }

    # /r/<receipt-id> deep-links (verify_url) fall back to the tool, which reads the id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
