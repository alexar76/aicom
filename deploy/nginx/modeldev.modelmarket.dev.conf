# AICOM factory marketing landing + preserved documentation — modeldev.modelmarket.dev
# Marketing frontend: loopback 9088 with AICOM_SITE_ROLE=factory-landing.
# Static documentation stays in /var/www/modeldev.modelmarket.dev.
# Working app: magic-ai-factory.com; ecosystem: ecosystem.modelmarket.dev.
# HTTP template only — deploy_ecosystem_landing.sh re-runs certbot --reinstall when a
# Let's Encrypt cert already exists (do not serve HTTPS via Gitea default_server).
# Install: sudo ./scripts/setup-modeldev-ecosystem-landing.sh
#
# DNS (Timeweb): A record modeldev → 203.0.113.10 (factory host).

# The hub-bridge rate-limit zone is declared once, at http level, by
# deploy/nginx/snippets/school-hub-zone.conf → /etc/nginx/conf.d/.

server {
    # Edge security headers (2026-10-08).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    listen 80;
    listen [::]:80;
    server_name modeldev.modelmarket.dev;

    root /var/www/modeldev.modelmarket.dev;
    index index.html;

    # IndexNow key (scripts/indexnow_submit.py).
    include /etc/nginx/snippets/indexnow-key.conf;

    # Encyclopedia / SEO hubs are real files. Never fall through to the landing
    # SPA — a missing locale used to look like "encyclopedia became the landing".
    location ^~ /encyclopedia/ {
        try_files $uri $uri/ =404;
    }
    location ^~ /learn/ {
        try_files $uri $uri/ =404;
    }
    location ^~ /oracles/ {
        try_files $uri $uri/ =404;
    }
    location ^~ /guides/ {
        try_files $uri $uri/ =404;
    }
    location ^~ /school/ {
        try_files $uri $uri/ =404;
    }

    location = / {
        proxy_pass http://127.0.0.1:9088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(ru|es|fr|zh)/?$ {
        proxy_pass http://127.0.0.1:9088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(_next/|factory/|fonts/|icons/|themes\.css$) {
        proxy_pass http://127.0.0.1:9088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ @factory_app;
    }
    location @factory_app {
        return 302 https://magic-ai-factory.com$request_uri;
    }

    location = /.well-known/ai-market.json {
        return 404;
    }

    # Same-origin bridge for the /school/ "Try it live" demos (hub CORS is
    # fail-closed by design — see the snippet header).
    include /etc/nginx/snippets/school-hub-bridge.conf;

    # Same-origin proxy for landing metrics bar (+ CORS for GitHub Pages fallback).
    location = /api/public/ecosystem-status {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://127.0.0.1:9081/api/public/ecosystem-status;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pages (alexar76.github.io/aicom) has no /api — JS falls back here.
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }
}
