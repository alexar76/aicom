# EMPORION — public-record facts for agents that trade.
#
# People get the landing at / (emporion/docs/landing, with the 3D agora); everything else is
# the same API as https://modelmarket.dev/providers/emporion/, which stays the address the hub
# federates with (EMPORION_PUBLIC_URL, AIMARKET_SELLS_FOR).
#
# DNS: A record  emporion  →  the factory host. The address is on the host, not in git.
# Upstream: the emporion container on loopback :9351 (scripts/deploy_emporion.sh), whose
#           rsync slice /opt/emporion/src/emporion also holds the landing this file serves —
#           every EMPORION deploy updates the page too.
# TLS: certbot certonly --webroot -w /var/www/certbot -d emporion.modelmarket.dev, then this
#      file in sites-available + a sites-enabled symlink; renew via certbot.timer.

upstream emporion_app { server 127.0.0.1:9351; keepalive 8; }

limit_req_zone $binary_remote_addr zone=emporion_api:10m rate=10r/s;

# ── HTTP: ACME + redirect to HTTPS ──────────────────────────────────────────
server {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    listen 80;
    listen [::]:80;
    server_name emporion.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: the landing for people, the API for agents ───────────────────────
server {
    proxy_redirect http://$host/ https://$host/;  # slash redirects must not leave https
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name emporion.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/emporion.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emporion.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    root /opt/emporion/src/emporion/docs/landing;

    # The page. Its scripts, styles, fonts and the scene's one request are all this origin.
    # add_header here replaces the server's, so the three above are repeated.
    location = / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ^~ /assets/ {
        expires 1h;
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    # The call log's operator API stays on loopback (curl 127.0.0.1:<port>/ops/v1/... on the
    # host, or an SSH tunnel): it is token-gated anyway, but it is no business of the internet.
    location ^~ /ops/ {
        return 404;
    }

    # Everything else is EMPORION itself: /ai-market/v2/*, /.well-known/ai-market.json, /health.
    location / {
        limit_req zone=emporion_api burst=40 nodelay;
        proxy_pass http://emporion_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
