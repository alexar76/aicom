# om.modelmarket.dev — STUB, not an Open-Meteo origin.
#
# The unused competing-lab node (nginx + bearer + Open-Meteo containers) was
# torn down. Live om-* pins use the GAIA sidecar on admin-vps:
#   GAIA_OM_BASE_URL=http://open-meteo:8080
# Do not proxy /v1/forecast here and do not re-raise deploy_om_node.sh on this name.
#
# Sibling of deploy/nginx/hub.modelmarket.dev.conf on the same host
# (108.165.32.182). TLS stays on the isolated om.modelmarket.dev lineage so
# HTTPS visitors get a 301 to the canonical Hub homepage, not a cert warning.
#
# Install / refresh (competing-lab only):
#   sudo cp deploy/nginx/om.modelmarket.dev.conf /etc/nginx/sites-available/om.modelmarket.dev
#   sudo ln -sfn /etc/nginx/sites-available/om.modelmarket.dev /etc/nginx/sites-enabled/om.modelmarket.dev
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name om.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://modelmarket.dev/;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name om.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/om.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/om.modelmarket.dev/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://modelmarket.dev/;
    }
}
