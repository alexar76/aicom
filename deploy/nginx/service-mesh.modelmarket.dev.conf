# AI Service Mesh — public dashboard + API edge
# DNS (Timeweb): A record  service-mesh  →  203.0.113.10  (factory / factory-host)
#
# Install:
#   sudo cp deploy/nginx/service-mesh.modelmarket.dev.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/service-mesh.modelmarket.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d service-mesh.modelmarket.dev --non-interactive --agree-tos -m ops@modelmarket.dev --redirect
#
# Backing containers (loopback only):
#   aicom-mesh-api       127.0.0.1:8090
#   aicom-mesh-dashboard 127.0.0.1:8091

upstream mesh_api { server 127.0.0.1:8090; keepalive 8; }
upstream mesh_dashboard { server 127.0.0.1:8091; keepalive 4; }

server {
    listen 80;
    listen [::]:80;
    server_name service-mesh.modelmarket.dev;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://mesh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://mesh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://mesh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://mesh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # SSE activity stream
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://mesh_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
