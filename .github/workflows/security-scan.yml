# Trimmed alexar76/aicom factory security scan.
# Copied to .github/workflows/security-scan.yml by scripts/publish_aicom_factory.sh.
# Satellite SDK paths are not present here — their audits run in satellite repos.
name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install gitleaks (pinned)
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
          gitleaks version

      # Scan only code that can hold live secrets — not docs/examples/fixtures
      # (full-tree --no-git on the public mirror has known doc/example FPs).
      - name: Run gitleaks on critical paths
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          for p in security web/backend web/frontend/src scripts core llm orchestrator agents; do
            if [[ -e "$p" ]]; then
              mkdir -p "$STAGE/$(dirname "$p")"
              cp -a "$p" "$STAGE/$p"
            fi
          done
          gitleaks detect --source "$STAGE" --redact --no-git --exit-code 1

  python-sast:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit==1.9.4

      - name: Run bandit (fail on High)
        run: |
          bandit -r web/backend security llm orchestrator agents \
            -x '*/tests/*' \
            -lll \
            -q

  python-deps:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Audit requirements.txt (full report)
        run: pip-audit -r requirements.txt --format json -o pip-audit-report.json
        continue-on-error: true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Audit gate (pip_audit_gate.sh)
        run: bash scripts/pip_audit_gate.sh

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: npm audit (full report)
        run: npm audit || true

      - name: Audit gate (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
