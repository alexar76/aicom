name: Mirror Satellites

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror satellite repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: aimarket-protocol
            repo: alexar76/aimarket-protocol
          - prefix: aimarket-hub
            repo: alexar76/aimarket-hub
          - prefix: aimarket-widget
            repo: alexar76/aimarket-widget
          - prefix: aimarket-agent
            repo: alexar76/aimarket-agent
          - prefix: plugins
            repo: alexar76/aimarket-plugins

    steps:
      - name: Checkout monorepo with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Verify working tree and prefix
        run: |
          git log -1 --oneline
          echo "Resolved HEAD: $(git rev-parse HEAD)"
          echo "Prefix contents:"
          ls -la ${{ matrix.prefix }}/

      - name: Push subtree to ${{ matrix.repo }}
        run: |
          git remote add satellite https://x-access-token:${{ secrets.MIRROR_SATELLITE_PAT }}@github.com/${{ matrix.repo }}.git
          git subtree push --prefix=${{ matrix.prefix }} satellite main
