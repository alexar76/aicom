# Trimmed alexar76/aicom factory CI — satellites live in their own repos.
# Copied to .github/workflows/ci.yml by scripts/publish_aicom_factory.sh.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch excluded satellite deps (hub / acex / plugins)
        run: bash scripts/ci_fetch_factory_test_deps.sh

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          bash scripts/ci_install_factory_test_deps.sh
          pip install ruff==0.15.15

      - name: Prepare writable data root
        run: |
          sudo mkdir -p /app/data/config /app/data/secrets /app/data/state /app/data/logs
          sudo chmod -R 0777 /app/data

      - name: Ruff — syntax / undefined-name gate
        run: ruff check core/ llm/ orchestrator/ security/ agents/ --select E9,F821 --ignore E402

      - name: Factory pytest suite
        env:
          USE_SQLITE: "true"
          AIFACTORY_DATA_ROOT: /app/data
        run: bash scripts/run_factory_pytest.sh

      - name: Refresh coverage badge
        run: python scripts/generate_coverage_badge.py

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: |
            coverage.json
            docs/badges/coverage.svg

      - name: Commit updated coverage badge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/badges/coverage.svg; then
            echo "Coverage badge unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/coverage.svg
          git commit -m "ci: refresh coverage badge [skip ci]"
          git push

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  prod-misconfig-smoke:
    name: Production misconfig guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch excluded satellite deps
        run: bash scripts/ci_fetch_factory_test_deps.sh

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          bash scripts/ci_install_factory_test_deps.sh
          pip install pip-audit==2.9.0

      - name: Prepare writable data root
        run: |
          sudo mkdir -p /app/data/config /app/data/secrets /app/data/state /app/data/logs
          sudo chmod -R 0777 /app/data

      - name: Prod startup guard tests
        env:
          AIFACTORY_DATA_ROOT: /app/data
        run: pytest -q tests/test_prod_startup_guard.py

      - name: pip-audit gate (KI-5)
        run: bash scripts/pip_audit_gate.sh
