[package]
name = "app-shell"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop shell — generated by AI-Factory"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "app_shell_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "app-shell"
path = "src/main.rs"
