[project]
# Prefixed on purpose. An unprefixed short name on PyPI is claimable by a
# stranger whose package installs a colliding top-level module; the same rule
# is recorded at the top of oracles/core/pyproject.toml.
name = "aimarket-hestia-agents"
version = "0.1.0"
description = "Deterministic AIMarket capability providers for the HESTIA hearth: signed decisions, canonical JSON, commit-reveal refereeing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
hestia-agents = "hestia_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hestia_agents"]

[tool.pytest.ini_options]
addopts = "--cov=hestia_agents --cov-report=term-missing --cov-branch --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Handlers are the product: they are executed by the hearth, not imported here.
"agents/*/handler.py" = ["S"]
"tests/*" = ["S"]
