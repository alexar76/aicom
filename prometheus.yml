# ============================================================================
# AI-Factory v2.1 — Prometheus Scrape Configuration
# ============================================================================
# Scrapes the AI-Factory application metrics endpoint on port 8081.
# The 'app' hostname resolves via the docker-compose internal network.
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aicom'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8081']
        labels:
          service: 'ai-factory'
