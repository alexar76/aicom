# Static defaults for documentation and non-Python tooling.
# Runtime code resolves paths via core.paths (data_root(), git_repos_dir(), …).
# Override install layout with AIFACTORY_DATA_ROOT / AIFACTORY_APP_ROOT / AIFACTORY_GIT_REPOS_DIR.
paths:
  data_root: /app/data
  specs: /app/data/specs
  arch: /app/data/arch
  code: /app/data/code
  bugs: /app/data/bugs
  state: /app/data/state
  logs: /app/data/logs
  telemetry: /app/data/telemetry
  config: /app/data/config
  reports: /app/data/reports
  secrets: /app/data/secrets
  git_repos: /app/git-repos
