[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-scout"
version = "0.1.0"
description = "Autonomous health watchdog for the alexar76 AI ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "pydantic-settings>=2.1.0",
    "apscheduler>=3.10.0",
    "rich>=13.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "pyyaml>=6.0",
    "deepdiff>=6.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "respx>=0.21.0", "httpx>=0.25.0"]

[project.scripts]
relay-scout = "relay_scout.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["relay_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
