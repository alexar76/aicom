<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="672" viewBox="0 0 1600 672" role="img"><title>A privacy warning became a correction in a welcome draft when an advisory flag was lost</title><defs></defs><rect x="0" y="0" width="1600" height="672" rx="0" fill="#f2dfdb" stroke="none" /><text x="190" y="88" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#804c50" >A REVIEW PIPELINE LOST ONE FIELD</text><g transform="rotate(-2 520 340)"><rect x="200" y="151" width="655" height="354" rx="5" fill="#fffdfa" stroke="#d9b7b3" /><text x="235" y="222" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#9b7771" >TOOL DESCRIPTION</text><text x="235" y="300" font-family="Georgia, serif" font-size="45" font-weight="400" fill="#342f36" >Remove secrets</text><text x="235" y="359" font-family="Georgia, serif" font-size="45" font-weight="400" fill="#342f36" >and personal data</text><text x="235" y="418" font-family="Georgia, serif" font-size="45" font-weight="400" fill="#342f36" >before submitting.</text></g><rect x="950" y="146" width="430" height="63" rx="10" fill="#fdeee8" stroke="#d39f96" /><text x="975" y="188" font-family="Menlo, monospace" font-size="31" font-weight="500" fill="#86514e" >advisory: true</text><path d="M 857 328 H 950" fill="none" stroke="#a45560" stroke-width="4" stroke-dasharray="8 9"/><path d="M 931 316 L 948 328 L 931 340" fill="none" stroke="#a45560" stroke-width="4" /><text x="881" y="285" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#a45560" >lost</text><rect x="985" y="250" width="400" height="242" rx="5" fill="#fffdfa" stroke="#d9b7b3" /><text x="1018" y="307" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#9b7771" >WELCOME DRAFT</text><text x="1018" y="374" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#a45560" >Rewrite this?</text><path d="M 1017 393 Q 1110 410 1270 391" fill="none" stroke="#bd6a70" stroke-width="3" /><text x="190" y="595" font-family="Menlo, monospace" font-size="50" font-weight="600" fill="#603c48" >Preserve advisory: true</text></svg>