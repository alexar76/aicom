<text x="67" y="669.84" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#ad514a">all findings available</text>
<text x="67" y="706.00" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626576">no separate advice subset</text>
<text x="576" y="174.68" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#247869">AFTER</text>
