<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img">
<title>Recorded findings eligible for a letter</title><desc>Two saved November 6 checker examples: textokit has zero eligible letter points and agent-exec has four. Local and container runs matched on the same downloaded documents. These are eligibility counts for two examples, not measurements of draft quality or safety.</desc>
<rect width="100%" height="100%" fill="#f8f6f1"/>
<text x="44" y="67.76" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#272b36">Recorded findings eligible for a letter</text>
<text x="44" y="120.68" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#626576">Two examples from the November 6 comparison</text>
<text x="44" y="159.00" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626576">Local and container checks used the same input documents</text>
<path d="M310 213 L310 416" stroke="#d9d5ca" stroke-width="2" fill="none"/>
<text x="303" y="193.00" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626576">0</text>
<path d="M450 213 L450 416" stroke="#d9d5ca" stroke-width="2" fill="none"/>
<text x="443" y="193.00" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626576">1</text>
<path d="M590 213 L590 416" stroke="#d9d5ca" stroke-width="2" fill="none"/>
<text x="583" y="193.00" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626576">2</text>
<path d="M730 213 L730 416" stroke="#d9d5ca" stroke-width="2" fill="none"/>
<text x="723" y="193.00" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626576">3</text>
<path d="M870 213 L870 416" stroke="#d9d5ca" stroke-width="2" fill="none"/>
<text x="863" y="193.00" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626576">4</text>
<text x="44" y="274.56" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#272b36">textokit</text>
<text x="44" y="379.56" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#272b36">agent-exec</text>
<rect x="305" y="254" width="10" height="10" rx="5" fill="#65518e" stroke="#65518e" stroke-width="2"/>
<text x="329" y="270.56" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#65518e">0</text>
<rect x="310" y="337" width="560" height="51" rx="5" fill="#65518e" stroke="#65518e" stroke-width="2"/>
<text x="886" y="374.56" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#65518e">4</text>
<text x="44" y="477.84" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#272b36">Counts describe eligible findings in these two saved examples.</text>
<text x="44" y="517.00" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626576">Draft quality and seller safety were not measured here.</text>
