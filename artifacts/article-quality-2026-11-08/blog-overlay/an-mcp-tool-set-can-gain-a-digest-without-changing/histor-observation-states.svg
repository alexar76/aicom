<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="768" viewBox="0 0 1100 768" role="img"><title>Read failure and profile refusal are distinct states</title><rect x="0" y="0" width="1100" height="768" rx="0" fill="#fbfaf5" stroke="none"/><text x="46" y="64" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#23352f">Where an absent digest comes from</text><rect x="45" y="135" width="285" height="115" rx="10" fill="#e5e9dc" stroke="none"/><text x="73" y="181" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#23352f">tools/list</text><text x="73" y="221" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#63735d">read attempt</text><path d="M 330 192 H 542" fill="none" stroke="#7d8f82" stroke-width="3"/><text x="370" y="166" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#925b40">failed</text><rect x="558" y="117" width="492" height="140" rx="10" fill="#f1e0d8" stroke="none"/><text x="584" y="164" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#894e35">not_observed</text><text x="584" y="210" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#70574b">no tool set read</text><path d="M 187 250 V 355" fill="none" stroke="#7d8f82" stroke-width="3"/><text x="211" y="310" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#3e6d4f">read OK</text><rect x="45" y="373" width="285" height="115" rx="10" fill="#e5e9dc" stroke="none"/><text x="73" y="419" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#23352f">Apply profile</text><text x="73" y="459" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#63735d">versioned rules</text><path d="M 330 430 H 428 V 385 H 542" fill="none" stroke="#7d8f82" stroke-width="3"/><text x="362" y="353" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#925b40">declined</text><rect x="558" y="319" width="492" height="147" rx="10" fill="#f4e9ce" stroke="none"/><text x="584" y="365" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#865e23">not_digestible</text><text x="584" y="410" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#74603e">code + revision</text><path d="M 428 430 V 596 H 542" fill="none" stroke="#7d8f82" stroke-width="3"/><text x="338" y="554" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#3e6d4f">accepted</text><rect x="558" y="530" width="492" height="134" rx="10" fill="#dfeee1" stroke="none"/><text x="584" y="578" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#2f6b48">tool-set digest</text><text x="584" y="621" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#476952">canonical bytes → SHA-256</text><text x="46" y="727" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#4b6153">A successfully read empty list is observed and digestible.</text></svg>