<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="958" viewBox="0 0 1600 958" role="img"><title>Definition equality under five local gateway fixture inputs</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6476"/></marker></defs><rect width="100%" height="100%" fill="#F5F8FA"/><text x="72" y="80" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#142C40" text-anchor="start">What actually stays equal</text><text x="72" y="127" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#4C6476" text-anchor="start">Local gateway renderer fixture · weather_now · full definition equality</text><rect x="72" y="178" width="1456" height="82" rx="16" fill="#142C40" stroke="none" stroke-width="2"/><text x="106" y="231" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">Fixture input</text><text x="665" y="231" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Price USD</text><text x="875" y="231" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Free calls</text><text x="1064" y="231" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Trial</text><text x="1325" y="231" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Definition</text><rect x="72" y="276" width="1456" height="75" rx="10" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="106" y="324" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#142C40" text-anchor="start">Baseline</text><text x="665" y="324" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">0.001</text><text x="875" y="324" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">5</text><text x="1064" y="324" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="middle">on</text><text x="1325" y="324" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#4C6476" text-anchor="middle">REFERENCE</text><rect x="72" y="363" width="1456" height="75" rx="10" fill="#EDF3F6" stroke="none" stroke-width="2"/><text x="106" y="411" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="start">Price edit</text><text x="665" y="411" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">0.050</text><text x="875" y="411" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">5</text><text x="1064" y="411" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="middle">on</text><text x="1325" y="411" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#087F77" text-anchor="middle">SAME</text><rect x="72" y="450" width="1456" height="75" rx="10" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="106" y="498" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="start">Allowance edit</text><text x="665" y="498" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">0.001</text><text x="875" y="498" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">9</text><text x="1064" y="498" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="middle">on</text><text x="1325" y="498" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#087F77" text-anchor="middle">SAME</text><rect x="72" y="537" width="1456" height="75" rx="10" fill="#EDF3F6" stroke="none" stroke-width="2"/><text x="106" y="585" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="start">Paid to free</text><text x="665" y="585" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">0.000</text><text x="875" y="585" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">5</text><text x="1064" y="585" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="middle">on</text><text x="1325" y="585" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#9B5B04" text-anchor="middle">CHANGED</text><rect x="72" y="624" width="1456" height="75" rx="10" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="106" y="672" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="start">Trial switched off</text><text x="665" y="672" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">0.001</text><text x="875" y="672" font-family="monospace" font-size="29" font-weight="400" fill="#142C40" text-anchor="middle">5</text><text x="1064" y="672" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="middle">off</text><text x="1325" y="672" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#9B5B04" text-anchor="middle">CHANGED</text><text x="72" y="786" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#087F77" text-anchor="start">Same: positive price 0.001 → 0.05; trial allowance 5 → 9.</text><text x="72" y="835" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#9B5B04" text-anchor="start">Changed: paid → free, or the trial phrase switched off.</text><text x="72" y="902" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">Chosen fixture inputs rendered locally; not a production rate or benchmark.</text></svg>
