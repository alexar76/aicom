<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img"><title>Process liveness and MCP admission are independent states</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6476"/></marker></defs><rect width="100%" height="100%" fill="#F5F8FA"/><text x="72" y="80" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#142C40" text-anchor="start">A running process can have no admitted MCP tools</text><text x="72" y="125" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">ARGUS implementation paths · recorded incident state on 6 November 2026</text><rect x="72" y="177" width="1456" height="132" rx="20" fill="#142C40" stroke="none" stroke-width="2"/><text x="106" y="228" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#FFFFFF" text-anchor="start">ARGUS process remains running</text><text x="106" y="274" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#CEE0EC" text-anchor="start">Container liveness does not depend on every MCP server being usable.</text><rect x="1156" y="203" width="330" height="76" rx="20" fill="#DBF3EC" stroke="none" stroke-width="2"/><text x="1321" y="251" font-family="monospace" font-size="31" font-weight="700" fill="#087F77" text-anchor="middle">status: &quot;ok&quot;</text><rect x="72" y="382" width="352" height="164" rx="20" fill="#FFFFFF" stroke="#B6C8D4" stroke-width="2"/><text x="104" y="431" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142C40" text-anchor="start">Hub tools/list</text><text x="104" y="475" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">names · descriptions</text><text x="104" y="513" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">input/output schemas</text><path d="M 424 464 H 494" fill="none" stroke="#4C6476" stroke-width="4" marker-end="url(#arrow)"/><rect x="510" y="382" width="410" height="164" rx="20" fill="#E7EFF9" stroke="#91ACC8" stroke-width="2"/><text x="546" y="433" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142C40" text-anchor="start">WARDEN checks</text><text x="546" y="477" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">Includes comparison with</text><text x="546" y="515" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">the approved snapshot</text><path d="M 920 424 H 980 V 393 H 1074" fill="none" stroke="#4C6476" stroke-width="4" marker-end="url(#arrow)"/><text x="984" y="367" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#087F77" text-anchor="start">allow</text><rect x="1090" y="348" width="438" height="100" rx="20" fill="#E8F4F1" stroke="#9FCAC0" stroke-width="2"/><text x="1122" y="390" font-family="monospace" font-size="30" font-weight="700" fill="#087F77" text-anchor="start">connected</text><text x="1122" y="429" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">vetted tools can be exposed</text><path d="M 920 505 H 1008 V 540 H 1074" fill="none" stroke="#4C6476" stroke-width="4" marker-end="url(#arrow)"/><text x="984" y="484" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9B5B04" text-anchor="start">drift</text><rect x="1090" y="490" width="438" height="112" rx="20" fill="#FFF0D7" stroke="#C9933D" stroke-width="2"/><text x="1122" y="535" font-family="monospace" font-size="30" font-weight="700" fill="#9B5B04" text-anchor="start">blocked</text><text x="1122" y="577" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9B5B04" text-anchor="start">TOOL_DEF_DRIFT · no tools</text><path d="M 248 546 V 688 H 1074" fill="none" stroke="#4C6476" stroke-width="4" marker-end="url(#arrow)"/><text x="420" y="664" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">tools/list cannot be read</text><rect x="1090" y="634" width="438" height="100" rx="20" fill="#EDF0F5" stroke="#B4BECC" stroke-width="2"/><text x="1122" y="676" font-family="monospace" font-size="30" font-weight="700" fill="#4C6476" text-anchor="start">failed</text><text x="1122" y="716" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">read / launch / connect failure</text><rect x="72" y="800" width="1456" height="234" rx="20" fill="#FFF8EA" stroke="#DDC28D" stroke-width="2"/><text x="108" y="852" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142C40" text-anchor="start">Recorded after the rollout, on all three ARGUS instances</text><text x="108" y="906" font-family="monospace" font-size="32" font-weight="700" fill="#9B5B04" text-anchor="start">connected 0     blocked 1     failed 0</text><text x="108" y="956" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#142C40" text-anchor="start">Review → human TTY approval → restart was still pending.</text><text x="108" y="1001" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#4C6476" text-anchor="start">Highlighted branch = incident state. Other branches show possible implementation paths.</text></svg>
