<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Golden diagram fixture</title>
  <style>
    body { margin: 0; background: #f4f4f5; font-family: system-ui, sans-serif; }
    svg { display: block; margin: 24px auto; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
      </marker>
    </defs>
    <rect x="0" y="0" width="520" height="320" fill="#f4f4f5"/>
    <rect x="40" y="40" width="140" height="56" rx="10" fill="#6366f1"/>
    <text x="110" y="76" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Start</text>
    <line x1="110" y1="96" x2="110" y2="132" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="110,160 90,200 130,200" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <text x="110" y="188" text-anchor="middle" fill="#334155" font-size="12">Decision</text>
    <line x1="90" y1="200" x2="56" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="130" y1="200" x2="380" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="8" y="248" width="96" height="48" rx="8" fill="#f87171"/>
    <text x="56" y="278" text-anchor="middle" fill="#fff" font-size="13">Error</text>
    <rect x="332" y="248" width="96" height="48" rx="8" fill="#34d399"/>
    <text x="380" y="278" text-anchor="middle" fill="#0f172a" font-size="13">OK</text>
  </svg>
</body>
</html>
