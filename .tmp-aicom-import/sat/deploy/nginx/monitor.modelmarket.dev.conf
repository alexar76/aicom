# Alien Monitor LIVE map — public subdomain.
#
# Public: no basic auth.
# DNS: A record  monitor  →  factory host.
# Upstream: alien-monitor-live on loopback :9101 (ALIEN_MODE=real).
#
# The image may still bake Vite base=/monitor-live/; keep both / and /monitor-live/
# so absolute asset URLs and a root bookmark both work (nginx strips the prefix).
# UNI lives on monitor-uni.modelmarket.dev (:9100).
#
# Do NOT redefine map $http_upgrade $connection_upgrade on this host.

upstream alien_monitor_live { server 127.0.0.1:9101; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name monitor.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/monitor.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 8m;

    # Baked Vite base=/monitor-live/ → absolute /monitor-live/assets|api|ws
    location ^~ /monitor-live/ {
        proxy_pass http://alien_monitor_live/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://alien_monitor_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
