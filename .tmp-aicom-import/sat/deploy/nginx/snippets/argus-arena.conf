# ARGUS Agent Arena — include inside magic-ai-factory.com server { } block (HTTPS vhost).
# Proxies https://magic-ai-factory.com/arena → http://127.0.0.1:8787/arena
# (arena.html fetches /arena/stats — keep this path prefix on the public host).

location = /arena {
    proxy_pass http://127.0.0.1:8787/arena;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /arena/ {
    proxy_pass http://127.0.0.1:8787/arena/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# UNI-mode ARGUS (Anvil / Universe) — second node on :8788
location = /arena-uni {
    return 302 /arena-uni/;
}

location ^~ /arena-uni/ {
    proxy_pass http://127.0.0.1:8788/arena/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ARGUS live API + Arena under /argus/* (Monitor, stats). Static promo paths live in
# argus-landing.conf (included once by the site vhost, before the catch-all proxy).
location = /argus/arena {
    return 302 /argus/arena/;
}

location ^~ /argus/arena/ {
    proxy_pass http://127.0.0.1:8787/arena/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Catch-all proxy for remaining /argus/* API paths (after argus-landing.conf static routes).
location ^~ /argus/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# UNI-mode ARGUS under /argus-uni/* (Anvil / Universe node on :8788)
location = /argus-uni {
    return 302 /argus-uni/;
}

location = /argus-uni/ {
    return 302 /argus-uni/arena;
}

location ^~ /argus-uni/ {
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
