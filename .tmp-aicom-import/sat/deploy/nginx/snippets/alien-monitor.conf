# Alien Monitor — factory path bookmarks → public subdomains.
# Include inside magic-ai-factory.com server { } (HTTPS vhost).
#
#   /monitor/      → UNI  https://monitor-uni.modelmarket.dev/
#   /monitor-live/ → LIVE https://monitor.modelmarket.dev/
#
# Prefix is stripped so /monitor/api/health → https://monitor-uni…/api/health.

location = /monitor {
    return 302 https://monitor-uni.modelmarket.dev/;
}

location ^~ /monitor/ {
    rewrite ^/monitor/(.*)$ https://monitor-uni.modelmarket.dev/$1 permanent;
}

location = /monitor-live {
    return 302 https://monitor.modelmarket.dev/;
}

location ^~ /monitor-live/ {
    rewrite ^/monitor-live/(.*)$ https://monitor.modelmarket.dev/$1 permanent;
}
