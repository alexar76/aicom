# AIMarket School — same-origin bridge to the AIMarket Hub.
#
# Why: the hub keeps a fail-closed CORS allowlist (AIMARKET_CORS_ORIGINS is empty
# by default — a `*` default enabled drive-by CSRF), so the browser "Try it live"
# demos on the School pages cannot fetch modelmarket.dev cross-origin. Instead of
# opening hub CORS to the whole web, each portal proxies an explicit allow-list of
# the four demo endpoints from its own origin.
#
# Include inside a server { } block of a School host (edu.modelmarket.dev, or
# modeldev.modelmarket.dev for the /school/ mirror). The `school_hub` rate-limit
# zone it uses is declared ONCE at http level by school-hub-zone.conf, installed
# to /etc/nginx/conf.d/ — never per vhost (nginx refuses to start on a duplicate).
#
# The client (school/build.py DEMO_JS) uses /hub/... only — it does NOT fall back
# to a cross-origin public hub call (that surfaces as Failed to fetch / CORS).
# Shipping this snippet on edu + modeldev is required for Try-it demos.
#
# Everything not listed here is denied — this is not a general hub proxy.

# 1. Capability search (lessons 01 · 06 · 10)
location = /hub/ai-market/v2/search {
    limit_except GET HEAD { deny all; }
    limit_req zone=school_hub burst=20 nodelay;
    proxy_pass http://127.0.0.1:9083/ai-market/v2/search$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host modelmarket.dev;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
}

# 2. Hub manifest (lesson 08)
location = /hub/ai-market/v2/manifest {
    limit_except GET HEAD { deny all; }
    limit_req zone=school_hub burst=20 nodelay;
    proxy_pass http://127.0.0.1:9083/ai-market/v2/manifest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host modelmarket.dev;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
}

# 3. Public protocol manifest (lessons 05 · 08)
location = /hub/.well-known/ai-market.json {
    limit_except GET HEAD { deny all; }
    limit_req zone=school_hub burst=20 nodelay;
    proxy_pass http://127.0.0.1:9083/.well-known/ai-market.json;
    proxy_http_version 1.1;
    proxy_set_header Host modelmarket.dev;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
}

# 4. Unpaid invoke → the HTTP 402 the lesson is about (lesson 04).
#    Tighter budget: this one reaches the payment path.
location = /hub/ai-market/v2/invoke {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=school_hub burst=5 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:9083/ai-market/v2/invoke;
    proxy_http_version 1.1;
    proxy_set_header Host modelmarket.dev;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Explicit allow-list: nothing else is bridged.
location ^~ /hub/ {
    return 403;
}
