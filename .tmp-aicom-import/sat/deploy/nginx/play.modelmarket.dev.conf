# AIMarket Playground — zero-setup GAIA → Metis → Hub receipt golden path.
# Runs ON the oracle host (203.0.113.20 / admin-vps), NOT the factory (212).
#
# DNS (Timeweb): A record  play  →  203.0.113.20
# Install: sudo ./scripts/deploy_playground.sh
#
# Backing container (loopback only, from aimarket-playground/docker-compose.yml):
#   playground  127.0.0.1:8075
#
# TLS: Let's Encrypt lineage play.modelmarket.dev via webroot.
# Do not use `certbot --nginx` to rewrite this file.

upstream playground_app { server 127.0.0.1:8075; keepalive 4; }

# Public invoke costs Hub + Metis budget — throttle per IP at the edge.
# (limit_req_status is already set once in logos.modelmarket.dev.conf — do not duplicate.)
limit_req_zone $binary_remote_addr zone=playground_api:10m rate=1r/s;

# ── HTTP: ACME + redirect to HTTPS ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name play.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/play.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 1m;

    location = /health {
        proxy_pass http://playground_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Background run can sit in Metis verify for up to ~640s.
    location /api/ {
        limit_req zone=playground_api burst=5 nodelay;
        proxy_pass http://playground_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location / {
        proxy_pass http://playground_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
