# Security headers for warden.modelmarket.dev, in a snippet because nginx
# `add_header` REPLACES inherited headers rather than merging: any location that
# adds a Cache-Control of its own would otherwise silently drop all of these.
#
# The page loads nothing from anywhere — inline styles, one inline script, no
# fonts, no CDN, no XHR — so the policy a browser enforces can say exactly that.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
