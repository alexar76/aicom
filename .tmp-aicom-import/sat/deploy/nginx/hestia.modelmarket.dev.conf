# HESTIA — the hearth. Isolated hosted runtime for AIMarket providers.
# Loopback-only container from hestia/docker-compose.yml (127.0.0.1:9480).
# nginx is the TLS edge. Do not expose 9480 on a public interface.
#
# DNS: A record  hestia  →  the host you run scripts/deploy_hestia.sh on.
# Do not invent a box. Do not put this vhost on hunt.
#
# Install: sudo HESTIA_DEPLOY_TOKEN=… ./scripts/deploy_hestia.sh

upstream hestia_app { server 127.0.0.1:9480; keepalive 4; }

# (limit_req_status is already set once in logos.modelmarket.dev.conf — do not duplicate.)
limit_req_zone $binary_remote_addr zone=hestia_write:10m rate=4r/s;
limit_req_zone $binary_remote_addr zone=hestia_invoke:10m rate=8r/s;

server {
    listen 80;
    listen [::]:80;
    server_name hestia.modelmarket.dev;

    client_max_body_size 256k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hestia.modelmarket.dev;

    client_max_body_size 256k;

    ssl_certificate     /etc/letsencrypt/live/hestia.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hestia.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /health {
        proxy_pass http://hestia_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/ai-market.json {
        proxy_pass http://hestia_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ai-market/v2/manifest {
        proxy_pass http://hestia_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ai-market/v2/invoke {
        limit_req zone=hestia_write burst=8 nodelay;
        proxy_pass http://hestia_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /v1/tenants {
        limit_req zone=hestia_write burst=8 nodelay;
        proxy_pass http://hestia_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /t/ {
        limit_req zone=hestia_invoke burst=16 nodelay;
        proxy_pass http://hestia_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://hestia_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
