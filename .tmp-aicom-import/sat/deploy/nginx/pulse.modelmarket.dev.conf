# Pulse Terminal — ACEX capital-markets dashboard.
#
# Public: no basic auth.
# DNS: A record  pulse  →  factory host (same as magic-ai-factory.com).
# Upstream: pulse-terminal on loopback :5199 (network_mode: host).
# Vite is baked with base=/pulse/, so the SPA and assets also live under /pulse/
# on this host. `/` serves the same index so a root bookmark works.
#
# Factory path https://magic-ai-factory.com/pulse/ stays proxied in
# deploy/nginx/snippets/pulse-terminal.conf (strips the prefix).
#
# Do NOT redefine map $http_upgrade $connection_upgrade — another vhost already does.

upstream pulse_terminal { server 127.0.0.1:5199; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name pulse.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pulse.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/pulse.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulse.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 8m;

    location / {
        proxy_pass http://pulse_terminal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
