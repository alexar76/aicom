# uni.modelmarket.dev — the sealed bubble's own hub, on its own name.
#
# A separate subdomain rather than a path on the live host, because the identity IS the
# safeguard: the seal stops money leaving the bubble, and nothing in code can stop a human
# reading virtual dollars as revenue. The name is the only thing that tells them apart from
# outside — inside, the API is deliberately identical.
server {
    listen 80;
    listen [::]:80;
    server_name uni.modelmarket.dev;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 on this host: http2 is a listen option, not a directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uni.modelmarket.dev;

    ssl_certificate     /etc/letsencrypt/live/uni.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uni.modelmarket.dev/privkey.pem;

    # The bubble's capability satellites, one location per satellite, generated by
    # deploy/uni-satellites.sh. They sit on paths under the hub's own name because the
    # crawler's SSRF guard rejects private addresses outright and the routed invoke takes
    # the same check — so a bubble peer needs a publicly resolvable host, and this is the one
    # it already has. Included BEFORE `location /` for clarity; nginx picks the longest
    # `^~` prefix regardless of order.
    include /etc/nginx/snippets/uni-satellites.conf;

    location / {
        proxy_pass http://127.0.0.1:9183/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
