# Optional overlay: mount LLM API keys as Docker secrets (not visible in `docker inspect` env).
#
#   mkdir -p data/secrets/llm
#   chmod 600 data/secrets/llm/deepseek_api_key
#   printf '%s' 'sk-...' > data/secrets/llm/deepseek_api_key
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Entrypoint also reads data/secrets/llm/* without this overlay when files exist on the bind mount.

services:
  app:
    secrets:
      - deepseek_api_key
      - anthropic_api_key
      - groq_api_key
      - together_api_key

secrets:
  deepseek_api_key:
    file: ./data/secrets/llm/deepseek_api_key
  anthropic_api_key:
    file: ./data/secrets/llm/anthropic_api_key
  groq_api_key:
    file: ./data/secrets/llm/groq_api_key
  together_api_key:
    file: ./data/secrets/llm/together_api_key
