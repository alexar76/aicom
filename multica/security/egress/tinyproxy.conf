Port 8888
Listen 0.0.0.0
Timeout 30
MaxClients 32
PidFile "/tmp/tinyproxy.pid"
# Do not log URL paths, query strings or headers to an agent-readable log.
LogLevel Critical
LogFile "/dev/stderr"
Allow 10.250.0.10
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allow"
ConnectPort 443
