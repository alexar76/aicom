Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Info
DisableViaHeader Yes
# Only the agent network may use the proxy (AGENT_SUBNET in onboard.sh).
Allow 10.250.0.0/24
# Hosts, not URLs; anchored extended regexes; anything else is refused.
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allow"
ConnectPort 443
