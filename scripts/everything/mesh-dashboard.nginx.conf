# Service-Mesh dashboard nginx — the ONE config that makes :8091 usable without a TLS edge.
#
# Why this file exists at all (and is not an edit to ai-service-mesh/frontend/):
#   * frontend/nginx.conf         proxies /v1/ and /health to http://127.0.0.1:8090 — i.e. to the
#                                 dashboard's OWN container, where nothing listens. Dead end.
#   * frontend/nginx.static.conf  (what the prod dashboard overlay selects via NGINX_CONF) has no
#                                 proxy at all — prod's host nginx did the proxying.
#   * frontend/Dockerfile         declares no ARG VITE_MESH_API_URL in the build stage, so the API
#                                 base URL cannot be baked in either; src/lib/api.ts:53 falls back
#                                 to '' (same origin).
# Same origin is therefore the only path that can work, and on one box with no edge the dashboard
# container has to do the proxying itself. This config is bind-mounted over
# /etc/nginx/conf.d/default.conf by docker-compose.everything.yml.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Resolve the API container at REQUEST time, not at config load. nginx caches an upstream
    # hostname's address forever otherwise, so the first `docker compose up -d mesh-api` after a
    # rebuild hands mesh-api a new IP and this dashboard proxies to a dead address — 502 on every
    # API call while the SPA itself still loads fine, which is the worst kind of broken. Docker's
    # embedded DNS is 127.0.0.11; putting the upstream in a variable forces the re-resolve.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mesh_api "mesh-api:8090";

    location /v1/ {
        proxy_pass http://$mesh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Also the container healthcheck target: a 200 here proves the SPA is served AND that the
    # dashboard can actually reach the mesh API. A check against `/` would pass on a dashboard
    # that renders an empty shell, which is exactly the failure this file fixes.
    location = /health {
        proxy_pass http://$mesh_api/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
