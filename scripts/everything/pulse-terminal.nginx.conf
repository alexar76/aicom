# Pulse Terminal — nginx for the EVERYTHING tier (no edge, bridge network).
#
# WHY THIS FILE EXISTS
# apps/pulse-terminal/nginx.prod.conf is written for `network_mode: host` and is
# wrong here in two independent ways:
#   1. `listen 127.0.0.1:5199` binds the CONTAINER's loopback. A published port
#      maps to the container's external interface, so `5199:5199` would connect
#      to nothing at all — the container looks healthy and refuses every request.
#   2. It proxies to http://127.0.0.1:9100 and http://127.0.0.1:9081, which on a
#      host network are the Monitor and the Factory API. Inside a bridged
#      container they are the container itself.
# Same routes, same buffering rules, correct bind and correct upstreams.

server {
    listen 5199;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve upstreams per request (see mesh-dashboard.nginx.conf for why).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $monitor_api "alien-monitor:9100";
    set $factory_api "app:8081";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /pulse/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /pulse/api/monitor/ {
        proxy_pass http://$monitor_api/api/pulse/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location ^~ /pulse/api/ {
        proxy_pass http://$factory_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        # SSE/stream must not be buffered or EventSource never sees the first tick.
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location ^~ /pulse/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location /api/monitor/ {
        proxy_pass http://$monitor_api/api/pulse/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$factory_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
