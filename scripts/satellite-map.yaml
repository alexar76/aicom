# Monorepo → GitHub satellite mapping (source of truth for mirror + release scripts).
# Org defaults to alexar76; override with SATELLITE_GITHUB_ORG env.
#
# Per-satellite `history:` controls how mirror_satellites.sh publishes:
#   mirror (default, may be omitted) — read-only: squashed orphan commit, force-pushed.
#                                      PRs are overwritten on the next sync.
#   live                             — append-only real history: normal commit + push
#                                      (never --force, never orphan). PRs are accepted;
#                                      merged PRs must be reverse-imported into the
#                                      monorepo (scripts/import_satellite_pr.sh) before
#                                      the next outbound sync, or the sync aborts.

org: alexar76

satellites:
