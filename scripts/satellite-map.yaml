  - id: warden
    repo: warden
    description: "WARDEN — MCP security firewall: vets an MCP server's tool definitions against static-scan rules, a signed threat feed, origin and tool-def pinning before any tool reaches the model. Zero-dependency TypeScript library."
    homepage: https://warden.modelmarket.dev
    topics:
      - mcp
      - mcp-security
      - model-context-protocol
      - prompt-injection
      - tool-poisoning
      - warden
      - firewall
      - security
      - typescript
      - zero-dependencies
    license: mit
    history: live
    paths:
      - warden
    export_layout:
      root_from: warden
    exclude_paths:
      - node_modules
      - dist
      - coverage
      # GH_PAT lacks `workflow` scope — drop until token can write Actions YAML.
      - .github/workflows/publish-mcp-registry.yml
    registries:
      - npm:@aimarket/warden
      - mcp-registry:io.github.alexar76/warden
      - glama:warden
      - github-releases
    ci:
      - npm-build
    notes: >
      TypeScript library satellite (alexar76/warden). Source of truth: warden/ in the monorepo.
      Extracted from argus/src/warden at 0.3.0 — same code, same ruleset v2 digest. ARGUS now
      depends on the published package and pins it EXACTLY, so RELEASE ORDER MATTERS: publish
      @aimarket/warden (scripts/publish_warden.sh) BEFORE publishing or mirroring argus, or npm ci
      there cannot resolve the dependency. For monorepo work, scripts/link_warden_local.sh symlinks
      the built package into argus/node_modules. history: live — this repo accepts PRs; reverse-import
      merged ones with scripts/import_satellite_pr.sh before the next outbound sync. Docs ship in five
      languages (en/ru/es/fr/zh); badges are generated by scripts/make-badges.mjs, and the test count
      in every README is asserted against the runner by test/docs.test.ts.
      MCP registries: Official Registry via server.json + .github/workflows/publish-mcp-registry.yml
      (./scripts/publish_mcp_registry.sh); Glama via glama.json; Smithery via smithery.yaml (connect
      repo in Smithery UI). mcp.so / PulseMCP are form submissions (docs/growth/seeding-playbook.md).
      LANDING: docs/landing/index.html — one self-contained file, five languages, no external
      assets. Live at https://warden.modelmarket.dev (nginx on the host that serves
      use.modelmarket.dev; deploy with scripts/deploy_warden_landing.sh, which verifies the CSP
      arrives on the wire). GitHub Pages is wired but NOT enabled: .github/workflows/pages.yml
      publishes docs/landing as the site root and needs the repo created plus Settings → Pages →
      Source: GitHub Actions — see docs/landing/README.md for the handoff. Every figure on the
      page is asserted against the code and the survey by test/landing.test.ts.

