    description: "SKOPOS (Σκοπός) — self-hosted nginx analytics and fleet security for the AICOM ecosystem. SSH log collection, Security Center with 3D threat map, scan history, and an AI agent with voice input."
    topics:
      - nginx
      - analytics
      - security
      - streamlit
      - aimarket
      - aicom
      - fleet-monitoring
      - ssh
      - self-hosted
    license: mit
    paths:
      - skopos
    export_layout:
      root_from: skopos
    exclude_paths:
      - .env
      - servers.yaml
      - agent.yaml
      - skopos.sqlite3
      - skopos.sqlite3-wal
      - skopos.sqlite3-shm
      # Quoted: bare `:memory:` is a YAML MAPPING, not a string. Unquoted it
      # parsed as {':memory': None}, which stringified into two junk rsync
      # excludes ("{':memory':" and "None}") and dropped the real one. The
      # sibling `-wal`/`-shm` forms happen to parse as strings; quoted anyway so
      # the three read as one thing.
      - ":memory:"
      - ":memory:-wal"
      - ":memory:-shm"
      - .skopos_wizard.json
      - .venv
      - venv
      - __pycache__
      - .pytest_cache
      - .coverage
    registries:
      - github-releases
      - ghcr:skopos
    ci:
      - pytest-skopos
    notes: >
      Python satellite (alexar76/skopos). Source of truth: skopos/ in the monorepo.
      Monitors factory / metis / oracle fleet over SSH. SECRETS: .env holds LLM keys,
      SKOPOS_DASHBOARD_PASSWORD, SKOPOS_SSH_KEY_PASSPHRASE — git-ignored and listed
      in exclude_paths above.
      GHCR: ghcr.io/alexar76/skopos.

