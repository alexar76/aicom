# Monorepo → GitHub satellite mapping (source of truth for mirror + release scripts).
# Org defaults to alexar76; override with SATELLITE_GITHUB_ORG env.

org: alexar76

satellites:
  - id: aimarket-desktop
    repo: aimarket-desktop
    description: "10 desktop & IDE apps for AIMarket — Flutter, Tauri, and VS Code in one Melos monorepo."
    license: mit
    paths:
      - desktop-integrations
    export_layout:
      apps_from: desktop-integrations
      packages_from: desktop-integrations/packages
      # Per-app language packs — colocated with SKU
      language_packs:
        source: desktop-integrations/{app}/language-packs
        target: apps/{app}/language-packs
    registries:
      - github-releases
    ci:
      - flutter-analyze
      - flutter-build-web-matrix
    notes: >
      Depends on aimarket-sdks (Dart) via pub git/path — not vendored in this repo.
      Do NOT embed aimarket-sdks/dart here; use separate aimarket-sdks satellite.

  - id: aimarket-sdks
    repo: aimarket-sdks
    description: "Official AIMarket client SDKs — Dart, TypeScript, and Rust."
    license: mit
    paths:
      - aimarket-sdks
    export_layout:
      root_from: aimarket-sdks
      preserve:
        - dart
        - typescript
        - rust
    registries:
      - pub.dev:aimarket_agent
      - npm:@aimarket/agent
      - crates.io:aimarket_agent
    ci:
      - dart-test
      - typescript-build
      - cargo-test

  - id: pulse-terminal
    repo: pulse-terminal
    description: "Pulse Terminal — ACEX capital markets dashboard with live agent pricing."
    license: mit
    paths:
      - apps/pulse-terminal
    export_layout:
      root_from: apps/pulse-terminal
    registries:
      - ghcr:pulse-terminal
      - github-releases
    ci:
      - npm-build
    notes: >
      ACEX capital markets UI. Consumes GET/WS /api/v2/capital/pricing from factory or hub.
      Part of acex ecosystem; ships as standalone repo for Electron/web distribution.

  - id: acex
    repo: acex
    description: "ACEX — Agent Capital Exchange: listings, CapShares, lending, and AMM for AI agents."
    license: apache-2.0
    paths:
      - acex
    export_layout:
      root_from: acex
    registries:
      - github-releases
    ci:
      - forge-test
      - pytest-acex-docs
    notes: >
      Pulse Terminal is a separate satellite (pulse-terminal), not a subfolder export.

  - id: ai-service-mesh
    repo: ai-service-mesh
    description: "AI Service Mesh — autonomous agent discovery, verification, escrow, and payments."
    license: mit
    paths:
      - ai-service-mesh
    export_layout:
      root_from: ai-service-mesh
    registries:
      - pypi:ai-service-mesh
      - ghcr:mesh-api
      - ghcr:mesh-dashboard
    ci:
      - pytest-backend
      - npm-build-frontend

  - id: aimarket-hub
    repo: aimarket-hub
    description: "AIMarket Hub — federated capability catalog, channels, invoke API, and plugins."
    license: apache-2.0
    paths:
      - aimarket-hub
    export_layout:
      root_from: aimarket-hub
    registries:
      - pypi:aimarket-hub
      - ghcr:aimarket-hub
    ci:
      - pytest-hub

  - id: aimarket-widget
    repo: aimarket-widget
    description: "Embeddable AIMarket storefront widget — drop-in JS/CSS for any website."
    license: mit
    paths:
      - aimarket-widget
    export_layout:
      root_from: aimarket-widget
    registries:
      - npm:@aimarket/widget
      - github-releases
    ci:
      - static-smoke

  - id: linkedin-profile-coach
    repo: linked-in-profile-coach
    description: "LinkedIn Profile Coach — Flutter desktop/mobile app for 24 LinkedIn sections, AI draft, scoring, and .docx resume support."
    license: mit
    paths:
      - linkedin
    export_layout:
      root_from: linkedin
    registries:
      - github-releases
    ci:
      - flutter-analyze

  - id: aicom-landing
    repo: aicom-landing
    description: "AI landing generator — one prompt → self-contained HTML in ~30-60s (MIT, 20 style presets)."
    license: mit
    paths:
      - aicom-landing
    export_layout:
      root_from: aicom-landing
    registries:
      - npm:aicom-landing
      - github-releases
    ci:
      - node-smoke

  - id: aimarket-protocol
    repo: aimarket-protocol
    description: "AIMarket Protocol v2 — open specs, JSON schemas, and test vectors."
    license: mit
    paths:
      - aimarket-protocol
    export_layout:
      root_from: aimarket-protocol
    registries:
      - github-releases
    ci: []

  - id: aimarket-agent
    repo: aimarket-agent
    description: "Python client for discovering and invoking AIMarket hub capabilities."
    license: mit
    paths:
      - aimarket-agent
    export_layout:
      root_from: aimarket-agent
    registries:
      - pypi:aimarket-agent
    ci:
      - pytest-agent

  - id: aimarket-plugins
    repo: aimarket-plugins
    description: "15 AIMarket hub plugins — TEE escrow, channels, reputation, safety, and more."
    license: mit
    paths:
      - plugins:plugins
      - aimarket-hub/plugins/aimarket-provenance
    export_layout:
      plugins_from: plugins
      extra:
        - from: aimarket-hub/plugins/aimarket-provenance
          to: plugins/aimarket-provenance
    registries:
      - pypi:per-plugin
    ci:
      - pytest-plugins

  - id: aicom-wiki
    repo: aicom.wiki
    description: "Documentation wiki for AI-Factory and the AIMarket ecosystem."
    license: mit
    paths:
      - scripts/wiki-gitea
    export_layout:
      root_from: scripts/wiki-gitea
      wiki_pages:
        include: "*.md"
        exclude:
          - README.md
    registries: []
    ci: []
    notes: >
      GitHub wiki repo (alexar76/aicom.wiki). Canonical markdown source: scripts/wiki-gitea/.
      Gitea wiki: scripts/push-gitea-wiki.sh. Local clone folder wiki/ is dev-only (not published).

  - id: alien-monitor
    repo: alien-monitor
    description: "Alien Monitor — real-time 3D ecosystem pulse visualizer with AI assistant."
    license: mit
    paths:
      # Only this monorepo folder — NOT linked-in-profile-coach / aicom-landing (separate repos).
      - alien-monitor
    export_layout:
      root_from: alien-monitor
    registries:
      - github-releases
    ci: []

  # Standalone sibling repos (not mirrored from monorepo paths — maintain in their own checkouts).
  - id: linked-in-profile-coach
    repo: linked-in-profile-coach
    description: "LinkedIn Profile Coach — Flutter desktop/mobile app (coach submodule / sibling repo)."
    license: mit
    optional: true
    paths: []
    notes: >
      Canonical source: github.com/alexar76/linked-in-profile-coach (or Gitea mirror).
      Do not add to alien-monitor paths. Submodule in aicom: coach/

  - id: aicom-landing
    repo: aicom-landing
    description: "Fast marketing landing generator — separate from full AI-Factory pipeline."
    license: mit
    optional: true
    paths: []
    notes: >
      Standalone repo (github.com/alexar76/aicom-landing). Not exported from monorepo paths.

  - id: aicom
    repo: aicom
    description: "AI-Factory — autonomous pipeline that designs, builds, tests, and publishes products."
    license: mit
    optional: true
    paths:
      - .
    exclude_paths:
      - desktop-integrations
      - acex
      - ai-service-mesh
      - aimarket-hub
      - aimarket-widget
      - aimarket-protocol
      - aimarket-agent
      - plugins
      - aimarket-sdks
      - apps/pulse-terminal
      - wiki
      - scripts/wiki-gitea
      - alien-monitor
    registries:
      - ghcr:aicom-factory
    ci:
      - pytest-core
