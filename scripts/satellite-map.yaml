      # Quoted: bare `:memory:` is a YAML MAPPING, not a string. Unquoted it
      # parsed as {':memory': None}, which stringified into two junk rsync
      # excludes ("{':memory':" and "None}") and dropped the real one. The
      # sibling `-wal`/`-shm` forms happen to parse as strings; quoted anyway so
      # the three read as one thing.
      - ":memory:"
      - ":memory:-wal"
      - ":memory:-shm"
      - .skopos_wizard.json
      - .venv
      - venv
      - __pycache__
      - .pytest_cache
      - .coverage
    registries:
