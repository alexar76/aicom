# Monorepo → GitHub satellite mapping (source of truth for mirror + release scripts).
# Org defaults to alexar76; override with SATELLITE_GITHUB_ORG env.

org: alexar76

# Standalone repos on github.com/alexar76 (not mirrored from monorepo).
extra_repos:
  - repo: aicom-landing
    description: "Quick landing page generation"
    topics:
      - ai
      - deepseek
      - html-generator
      - javascript
      - landing-page
      - landing-page-generator
      - llm
      - mit-license
      - no-database
      - nodejs
      - ollama
      - openai
      - self-hosted
      - static-site
  - repo: linked-in-profile-coach
    description: "LinkedIn profile coach — AI headlines, summaries, and networking tips with local-first privacy."
    topics:
      - ai
      - career
      - coach
      - job-search
      - linkedin
      - llm
      - profile
      - self-hosted

satellites:
  - id: aimarket-desktop
    repo: aimarket-desktop
    description: "10 desktop & IDE apps for AIMarket — Flutter, Tauri, and VS Code in one Melos monorepo."
    topics:
      - aimarket
      - flutter
      - dart
      - tauri
      - vscode-extension
      - desktop-app
      - melos
      - marketplace
      - ai-agents
      - local-first
    license: mit
    paths:
      - desktop-integrations
    export_layout:
      apps_from: desktop-integrations
      packages_from: desktop-integrations/packages
      # Per-app language packs — colocated with SKU
      language_packs:
        source: desktop-integrations/{app}/language-packs
        target: apps/{app}/language-packs
    registries:
      - github-releases
    ci:
      - flutter-analyze
      - flutter-build-web-matrix
    notes: >
      Depends on aimarket-sdks (Dart) via pub git/path — not vendored in this repo.
      Do NOT embed aimarket-sdks/dart here; use separate aimarket-sdks satellite.

  - id: aimarket-sdks
    repo: aimarket-sdks
    description: "Official AIMarket client SDKs — Dart, TypeScript, and Rust."
    topics:
      - aimarket
      - sdk
      - dart
      - typescript
      - rust
      - client-library
      - ai-agents
    license: mit
    paths:
      - aimarket-sdks
    export_layout:
      root_from: aimarket-sdks
      preserve:
        - dart
        - typescript
        - rust
    registries:
      - pub.dev:aimarket_agent
      - npm:@aimarket/agent
      - crates.io:aimarket_agent
    ci:
      - dart-test
      - typescript-build
      - cargo-test

  - id: pulse-terminal
    repo: pulse-terminal
    description: "Pulse Terminal — ACEX capital markets dashboard with live agent pricing."
    topics:
      - acex
      - ai-agents
      - capital-markets
      - dashboard
      - electron
      - trading
      - websocket
    license: mit
    paths:
      - apps/pulse-terminal
    export_layout:
      root_from: apps/pulse-terminal
    registries:
      - ghcr:pulse-terminal
      - github-releases
    ci:
      - npm-build
    notes: >
      ACEX capital markets UI. Consumes GET/WS /api/v2/capital/pricing from factory or hub.
      Part of acex ecosystem; ships as standalone repo for Electron/web distribution.

  - id: acex
    repo: acex
    description: "ACEX — Agent Capital Exchange: listings, CapShares, lending, and AMM for AI agents."
    topics:
      - acex
      - ai-agents
      - capital-markets
      - defi
      - ethereum
      - smart-contracts
      - agent-economy
    license: apache-2.0
    paths:
      - acex
    export_layout:
      root_from: acex
    registries:
      - github-releases
    ci:
      - forge-test
      - pytest-acex-docs
    notes: >
      Pulse Terminal is a separate satellite (pulse-terminal), not a subfolder export.

  - id: ai-service-mesh
    repo: ai-service-mesh
    description: "AI Service Mesh — autonomous agent discovery, verification, escrow, and payments."
    topics:
      - ai-agents
      - service-mesh
      - discovery
      - escrow
      - payments
      - python
      - fastapi
      - self-hosted
    license: mit
    paths:
      - ai-service-mesh
    export_layout:
      root_from: ai-service-mesh
    registries:
      - pypi:ai-service-mesh
      - ghcr:mesh-api
      - ghcr:mesh-dashboard
    ci:
      - pytest-backend
      - npm-build-frontend

  - id: aimarket-hub
    repo: aimarket-hub
    description: "AIMarket Hub — federated capability catalog, channels, invoke API, and plugins."
    topics:
      - aimarket
      - ai-agents
      - marketplace
      - python
      - fastapi
      - mcp
      - plugins
      - federation
      - api
    license: apache-2.0
    paths:
      - aimarket-hub
    export_layout:
      root_from: aimarket-hub
    registries:
      - pypi:aimarket-hub
      - ghcr:aimarket-hub
    ci:
      - pytest-hub

  - id: aimarket-widget
    repo: aimarket-widget
    description: "Embeddable AIMarket storefront widget — drop-in JS/CSS for any website."
    topics:
      - aimarket
      - javascript
      - widget
      - embeddable
      - storefront
      - html
      - css
      - ai-agents
    license: mit
    paths:
      - aimarket-widget
    export_layout:
      root_from: aimarket-widget
    registries:
      - npm:@aimarket/widget
      - github-releases
    ci:
      - static-smoke

  - id: aimarket-protocol
    repo: aimarket-protocol
    description: "AIMarket Protocol v2 — open specs, JSON schemas, and test vectors."
    topics:
      - aimarket
      - open-source
      - json-schema
      - protocol
      - api-spec
      - ai-agents
      - interoperability
    license: mit
    paths:
      - aimarket-protocol
    export_layout:
      root_from: aimarket-protocol
    registries:
      - github-releases
    ci: []

  - id: aimarket-agent
    repo: aimarket-agent
    description: "Python client for discovering and invoking AIMarket hub capabilities."
    topics:
      - aimarket
      - python
      - ai-agents
      - sdk
      - httpx
      - pip
      - mcp
      - automation
    license: mit
    paths:
      - aimarket-agent
    export_layout:
      root_from: aimarket-agent
    registries:
      - pypi:aimarket-agent
    ci:
      - pytest-agent

  - id: aimarket-plugins
    repo: aimarket-plugins
    description: "15 AIMarket hub plugins — TEE escrow, channels, reputation, safety, and more."
    topics:
      - aimarket
      - plugins
      - python
      - tee
      - escrow
      - reputation
      - safety
      - channels
      - ai-agents
    license: mit
    paths:
      - plugins:plugins
      - aimarket-hub/plugins/aimarket-provenance
    export_layout:
      plugins_from: plugins
      extra:
        - from: aimarket-hub/plugins/aimarket-provenance
          to: plugins/aimarket-provenance
    registries:
      - pypi:per-plugin
    ci:
      - pytest-plugins

  - id: aicom-wiki
    repo: aicom.wiki
    description: "Documentation wiki for AI-Factory and the AIMarket ecosystem."
    license: mit
    paths:
      - scripts/wiki-gitea
    export_layout:
      root_from: scripts/wiki-gitea
      wiki_pages:
        include: "*.md"
        exclude:
          - README.md
    registries: []
    ci: []
    notes: >
      GitHub wiki repo (alexar76/aicom.wiki). Canonical markdown source: scripts/wiki-gitea/.
      Gitea wiki: scripts/push-gitea-wiki.sh. Local clone folder wiki/ is dev-only (not published).

  - id: aicom
    repo: aicom
    description: "AI-Factory — autonomous pipeline that designs, builds, tests, and publishes products."
    topics:
      - ai
      - ai-agents
      - autonomous-agents
      - docker
      - fastapi
      - llm
      - nextjs
      - python
      - self-hosted
      - agent-economy
    license: mit
    optional: true
    paths:
      - .
    exclude_paths:
      - desktop-integrations
      - acex
      - ai-service-mesh
      - aimarket-hub
      - aimarket-widget
      - aimarket-protocol
      - aimarket-agent
      - plugins
      - aimarket-sdks
      - apps/pulse-terminal
      - wiki
      - scripts/wiki-gitea
    registries:
      - ghcr:aicom-factory
    ci:
      - pytest-core
