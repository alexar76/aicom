<style>
  :root {
    --bg: #02030a;
    --ink: #cfe3ff;
    --muted: #7e9fd0;
    --cyan: #38e0ff;
    --violet: #7b5cff;
    --head: "Orbitron", system-ui, sans-serif;
    --body: "Rajdhani", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background:
      radial-gradient(50vw 50vw at 20% -10%, rgba(56,224,255,.12), transparent 60%),
      radial-gradient(46vw 46vw at 90% 10%, rgba(123,92,255,.14), transparent 60%),
      var(--bg);
    color: var(--ink); font-family: var(--body); text-align: center; padding: 32px 20px;
  }
  h1 {
    font-family: var(--head); font-weight: 900; letter-spacing: .18em;
    font-size: clamp(2rem, 6vw, 3.4rem); margin: 0 0 12px;
  }
  p { color: var(--muted); font-size: 1.15rem; max-width: 36rem; margin: 0 auto 28px; }
  a.cta {
    display: inline-block; text-decoration: none; color: #02030a; font-weight: 700;
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    padding: 14px 28px; border-radius: 999px; letter-spacing: .04em;
  }
  .links { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 14px 22px; justify-content: center; }
  .links a { color: var(--cyan); text-decoration: none; font-size: .95rem; }
  .links a:hover { text-decoration: underline; }
</style>
