<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc">
  <title id="title">AIMarket ecosystem - money and trust spine</title>
  <desc id="desc">Factory scaffolds onto HESTIA (hearth); HESTIA announces to Hub; Oracles and METIS feed the Hub; ARGUS consumes; Attested Memory keeps verifiable agent memory; Agent Capital Exchange finances; SKOPOS watches the fleet; MOMUS finds; Treasury pays on verify; LOGOS analyzes read-only federation data; eSIM operators sell travel eSIMs to agents over x402 and bring buyers' signed delivery receipts to the Hub; SYMMARTYS sells commerce lookups (EU VAT, LEI, ECB reference rates, sanctions lists, timestamp proofs) through the Hub; domain operators register a quoted domain for an agent over x402 on Openprovider or Porkbun Sandbox and keep their own registrar account.</desc>
