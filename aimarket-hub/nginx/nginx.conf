# AIMarket Hub — nginx reverse proxy for modelmarket.dev
# Handles TLS termination, rate limiting, and static file caching.

upstream hub_backend {
    server 127.0.0.1:9080;
}

upstream factory_backend {
    server 127.0.0.1:8000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=hub_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=hub_invoke:10m rate=10r/s;

server {
    listen 80;
    server_name modelmarket.dev www.modelmarket.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name modelmarket.dev www.modelmarket.dev;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modelmarket.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # ── Hub API ──────────────────────────────────────────────

    location /.well-known/ {
        proxy_pass http://hub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aggressive caching for .well-known (rarely changes)
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location /ai-market/ {
        limit_req zone=hub_api burst=50 nodelay;
        proxy_pass http://hub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # Long timeout for invocations
    }

    # Invoke endpoint — stricter rate limit
    location /ai-market/v2/invoke {
        limit_req zone=hub_invoke burst=20 nodelay;
        proxy_pass http://hub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Widget static files ──────────────────────────────────

    location /widget/ {
        proxy_pass http://hub_backend;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /widget.js {
        proxy_pass http://hub_backend/widget/widget.js;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /themes.css {
        proxy_pass http://hub_backend/widget/themes.css;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Live stream ──────────────────────────────────────────

    location /live {
        proxy_pass http://hub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;  # For potential SSE/streaming
    }

    # ── Factory (if co-located) ──────────────────────────────

    location / {
        proxy_pass http://factory_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check ─────────────────────────────────────────

    location /health {
        proxy_pass http://hub_backend/.well-known/ai-market.json;
        proxy_set_header Host $host;
        access_log off;
    }
}
